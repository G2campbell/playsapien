name: test

# Only the backend and the SDK run here. The two game builds still hard-code
# /tmp paths and Word Chain's needs a dict.txt that is not in the repo
# (docs/INTEGRATION-AUDIT.md, S8). They join once that is fixed.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci || npm install
        working-directory: backend
      - run: npm test
        working-directory: backend

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci || npm install
        working-directory: packages/sdk
      - run: npm test
        working-directory: packages/sdk
      - name: the bundle must build
        run: npx --yes esbuild packages/sdk/src/index.js --bundle --format=esm --minify --outfile=/tmp/sdk.js

  tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: every text token clears 4.5:1 on every ground
        run: node packages/tokens/check-contrast.mjs
      - name: the inlined copies have not drifted from the canonical files
        run: node packages/tokens/check-inline.mjs
