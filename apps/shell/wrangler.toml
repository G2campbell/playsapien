# The front door: playsapien.com/ plus /about/, /privacy/, /terms/, and the
# three files every surface loads from the root (sdk.js, tokens.css, theme.js).
#
# `name` matches the Worker that already exists in the account and already
# holds the playsapien.com custom domain, so deploying updates that Worker
# rather than creating a second one beside it.
#
# There are deliberately no routes here. The custom domain already sends the
# whole hostname to this Worker, and Cloudflare treats a custom-domain Worker
# as the ORIGIN: a Worker on a route is evaluated first. So each game's route
# (playsapien.com/wordchain/*, /sojourner/*, /api/*) intercepts its own paths
# before they ever reach this one, and everything else lands here. Adding a
# game never means touching this file.
#
# No `main` on purpose: a Worker with assets and no script just serves files.

name = "playsapien"
compatibility_date = "2026-09-15"

[assets]
directory = "./cfroot"
not_found_handling = "404-page"
