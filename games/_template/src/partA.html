<!-- The game's own CSS. Everything platform-shaped -- sheets, the corner bar,
     settings rows, buttons, fields, the toast -- comes from packages/ui/ui.css,
     which build.py inlines above this. Do not restate any of it here.

     What belongs in this file:
       1. the DIALS, where this game's chrome legitimately differs
       2. the game's own screens and pieces
-->
<style>
:root{
  /* ---- ui.css dials. Delete any you do not need; every one has a default.
          The full list is in packages/ui/ui.css's header. ---------------- */
  --btn-radius:12px;
  --btn-pad:14px 22px;
  --icon-fg:var(--fg-2); --icon-fg-on:var(--fg);
  --icon-wash:color-mix(in srgb, var(--fg) 8%, transparent);
  --sh-title-weight:700;
}

/* ---- the game ----------------------------------------------------------- */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100dvh;
  background:var(--bg); color:var(--fg);
  font-family:var(--f-body); font-size:16px; line-height:1.55;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
#app{min-height:100dvh; display:flex; flex-direction:column}

.topbar{
  display:flex; align-items:center; gap:10px;
  padding:calc(env(safe-area-inset-top) + 9px) 12px 9px;
  border-bottom:1px solid var(--line);
}
.topbar .spacer{flex:1}
/* Every game carries a quiet way back to the platform. */
.homelink{
  display:inline-flex; align-items:center; gap:6px;
  font-family:var(--f-mono); font-size:11px; letter-spacing:.1em;
  text-transform:uppercase; text-decoration:none; color:var(--fg-3);
}
.homelink:hover{color:var(--fg-2)}

main{flex:1; display:flex; flex-direction:column; align-items:center;
     justify-content:center; text-align:center; padding:24px 20px; gap:14px}
h1{font-family:var(--f-disp); font-weight:var(--w-disp-game,700);
   font-size:clamp(34px,10vw,52px); letter-spacing:-.02em; margin:0; line-height:1}
.tagline{margin:0; color:var(--fg-2); max-width:30ch; text-wrap:balance}
.board{
  width:min(420px,100%); min-height:180px; margin:10px 0;
  display:grid; place-items:center;
  background:var(--bg-raise); border:1px solid var(--line);
  border-radius:16px; color:var(--fg-3);
}
footer{padding:18px; text-align:center; font-size:12.5px; color:var(--fg-3)}
</style>
