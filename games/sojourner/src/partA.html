<!-- ===========================================================================
     THE THEME, and why it is the first thing in this file.

     `packages/tokens/theme.js`, inlined VERBATIM between the markers below.
     Do not edit the copy -- edit the canonical file and re-inline; CI diffs the
     two. It has to be inline and it has to be here, ahead of the webfont
     stylesheet and the rule block below it, because it stamps data-theme on
     <html> BEFORE first paint. Loaded any later and the page renders in one
     theme and snaps to the other, which is the flash every themed site is
     judged on.

     AND NOTHING IN THIS COMMENT MAY SPELL THE OPENING STYLE TAG. build.py
     splits partA on the first literal occurrence of it and carries everything
     before that into <head>; a mention of the tag in prose up here is indexed
     as the real one and the split lands mid-comment. It did, once, while this
     was being written -- the harness caught it, a reading of the diff would not
     have. The split is what puts this script in the head of the hosted build;
     the single-file build concatenates partA whole and it lands there anyway.
     =========================================================================== -->
<script>
/* ===== BEGIN packages/tokens/theme.js (inlined verbatim — do not edit here) ===== */
/* ===========================================================================
   The theme mechanism. One copy, inlined into all three surfaces.

   This file is the source of truth. The shell and both games each inline it
   verbatim into an inline script in the head, BEFORE any stylesheet, because
   it has to run before first paint — otherwise the page renders light and then
   snaps to dark, which is the flash every themed site is judged on.

   It is deliberately tiny, dependency-free, and written in ES5 so it can sit
   in a plain inline script element in any of the three builds without a
   transpile step or a module boundary.

   WHAT IT DOES

     - Reads the player's choice from localStorage `ps:theme`. One key for the
       whole platform, because all three surfaces are one origin. Choose dark
       in Word Chain and the shell is dark when you come back to it.
     - Stamps data-theme="light" or "dark" on <html>, or removes the attribute
       for "system" so the CSS media query takes over.
     - Adds the surface class (ps-shell / sj-game / wc-game) so tokens.css
       knows which palette to serve.
     - Keeps <meta name="theme-color"> in step, so the phone's status bar
       matches the page rather than the other way round.
     - Follows the OS live while the setting is "system", via a
       prefers-color-scheme listener. Without it, a player who flips their
       phone to dark at sunset sees the page change only on reload.

   MIGRATION. Word Chain stored its theme at `wordchain:set.theme` before the
   platform existed. On first run, if `ps:theme` is unset and that older value
   exists, it is adopted so nobody loses their choice.
   =========================================================================== */

(function (global) {
  'use strict';

  var KEY = 'ps:theme';
  var LEGACY = 'wordchain:set';
  var VALID = { light: 1, dark: 1, system: 1 };

  /* Both grounds, per surface, straight from tokens.css. The status bar has to
     be told a literal colour; it cannot read a custom property. */
  var BAR = {
    'ps-shell': { light: '#C5C6C1', dark: '#3D352A' },
    'sj-game':  { light: '#F0E8DA', dark: '#0C0B0A' },
    'wc-game':  { light: '#E8D1DA', dark: '#3C2F34' }
  };

  function read() {
    try {
      var v = localStorage.getItem(KEY);
      if (v && VALID[v]) return v;
      /* one-time adoption of Word Chain's older per-game setting */
      var old = JSON.parse(localStorage.getItem(LEGACY) || '{}');
      if (old && old.theme && VALID[old.theme]) {
        try { localStorage.setItem(KEY, old.theme); } catch (e) {}
        return old.theme;
      }
    } catch (e) {}
    /* Light is the default. Following the OS by default meant one account
       saw a light desktop and a dark phone with no way to say which it
       wanted; "system" is now something you choose, not a default. */
    return 'light';
  }

  function write(v) {
    try { localStorage.setItem(KEY, v); } catch (e) {}
  }

  /* What the page is actually showing right now, which is not the same thing
     as what the player chose: "system" resolves to one or the other. */
  function resolved(choice) {
    if (choice === 'light' || choice === 'dark') return choice;
    try {
      return global.matchMedia && global.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    } catch (e) { return 'light'; }
  }

  function apply(choice, surface) {
    var el = document.documentElement;
    if (choice === 'system') el.removeAttribute('data-theme');
    else el.setAttribute('data-theme', choice);
    if (surface && !el.classList.contains(surface)) el.classList.add(surface);

    var pal = BAR[surface || currentSurface()];
    if (pal) {
      var m = document.querySelector('meta[name="theme-color"]');
      if (!m) {
        m = document.createElement('meta');
        m.setAttribute('name', 'theme-color');
        (document.head || el).appendChild(m);
      }
      m.setAttribute('content', pal[resolved(choice)]);
    }
    return choice;
  }

  function currentSurface() {
    var c = document.documentElement.className || '';
    if (c.indexOf('ps-shell') > -1) return 'ps-shell';
    if (c.indexOf('sj-game') > -1) return 'sj-game';
    if (c.indexOf('wc-game') > -1) return 'wc-game';
    return null;
  }

  var listeners = [];

  var Theme = {
    /* Call once, as the first thing in <head>. `surface` is one of
       'ps-shell' | 'sj-game' | 'wc-game'. */
    init: function (surface) {
      var choice = read();
      apply(choice, surface);
      /* Track the OS while the choice is "system". Safari before 14 has only
         addListener, hence the fallback. */
      try {
        var mq = global.matchMedia('(prefers-color-scheme: dark)');
        var onChange = function () {
          if (read() !== 'system') return;
          apply('system', surface);
          notify();
        };
        if (mq.addEventListener) mq.addEventListener('change', onChange);
        else if (mq.addListener) mq.addListener(onChange);
      } catch (e) {}
      return choice;
    },

    /* The player's choice: 'light' | 'dark' | 'system'. */
    get: read,

    /* What is on screen: 'light' | 'dark'. */
    resolved: function () { return resolved(read()); },

    set: function (v) {
      if (!VALID[v]) return read();
      write(v);
      apply(v, currentSurface());
      notify();
      return v;
    },

    /* Fires whenever the rendered theme changes, from either a click here or
       the OS changing under a "system" setting. Canvas that has painted its
       own colours — a share card, a globe overlay — should redraw on this. */
    onChange: function (fn) { if (typeof fn === 'function') listeners.push(fn); },

    /* Wire a three-button segmented control. Each button carries
       data-theme="light|dark|system". Keeps aria-pressed honest. */
    bindControl: function (el) {
      if (!el) return;
      var paint = function () {
        var cur = read();
        for (var i = 0; i < el.children.length; i++) {
          var b = el.children[i];
          b.setAttribute('aria-pressed', b.getAttribute('data-theme') === cur ? 'true' : 'false');
        }
      };
      el.addEventListener('click', function (e) {
        var b = e.target.closest ? e.target.closest('[data-theme]') : null;
        if (!b || !el.contains(b)) return;
        Theme.set(b.getAttribute('data-theme'));
        paint();
      });
      listeners.push(paint);
      paint();
    }
  };

  function notify() {
    var r = resolved(read());
    for (var i = 0; i < listeners.length; i++) {
      try { listeners[i](r); } catch (e) {}
    }
  }

  global.PSTheme = Theme;
})(typeof window !== 'undefined' ? window : this);
/* ===== END packages/tokens/theme.js ===== */
PSTheme.init('sj-game');
</script>
<!-- `packages/ui/ui.js`, INLINED VERBATIM between the markers below, exactly
     as theme.js is above it. It has no work to do before first paint, but it
     has to be DEFINED before partD.js runs, and build.py splits partA on the
     first opening style tag and carries everything above it into <head> -- so
     here, above that tag, is where a script belongs. PSUI.init() is called from
     partD.js once the markup exists. -->
<script>
/* ===== BEGIN packages/ui/ui.js (inlined verbatim — do not edit here) ===== */
/* ===========================================================================
   PlaySapien UI behaviour — the half of the chrome that is not CSS.

   Sheets and toasts, which every game reimplemented. Sojourner had TWO
   parallel sheet systems (closeSheets for in-game sheets, openPanel/closePanels
   for the corner panels); Word Chain had one; the shell had a third. All three
   did the same thing, and none of them trapped focus, so a keyboard user could
   tab straight past the scrim into the page behind.

   ES5, dependency-free, no build step, ~120 lines. Inlined verbatim into every
   surface after ui.css; check-inline.mjs fails the build if a copy drifts.

   USAGE

     PSUI.init({ sheets: ['aboutSheet','settingsSheet'], scrim: 'scrim',
                 toast: 'toast' });
     PSUI.open('aboutSheet');
     PSUI.open('confirmSheet', { stack: true });   // over the one already open
     PSUI.open('revealSheet',  { scrim: false });  // do not dim what is behind
     PSUI.close();        // closes the topmost only
     PSUI.closeAll();
     PSUI.toast('Copied');

   Escape and a scrim click close the TOPMOST sheet. Focus moves into it on
   open and returns to whatever opened it on close.

   Two options exist because both games needed them the moment they adopted
   this file:

     stack   Word Chain asks "Delete this chain?" from inside an open sheet.
             Without a stack, the confirm and the sheet fight over Escape and
             the focus trap drags Tab back into the sheet underneath.
     scrim   Sojourner's round reveal flies the globe to the answer. Dimming
             and blocking the globe at exactly the moment the player is looking
             at it is the wrong behaviour, and it was a regression the first
             time this file did not offer the choice.
   =========================================================================== */

(function (global) {
  'use strict';

  var sheetIds = [];
  var scrimEl = null;
  var toastEl = null;
  var toastTimer = null;
  var closers = [];
  /* Open sheets, innermost last. Each entry: {id, scrim, focus} where `focus`
     is whatever had focus when it opened, so closing restores in reverse. */
  var stack = [];

  function $(id) { return document.getElementById(id); }

  /* The topmost open sheet -- what Escape closes and what traps focus. */
  function openId() { return stack.length ? stack[stack.length - 1].id : null; }
  function isOpen(id) {
    for (var i = 0; i < stack.length; i++) if (stack[i].id === id) return true;
    return false;
  }
  function wantsScrim() {
    for (var i = 0; i < stack.length; i++) if (stack[i].scrim) return true;
    return false;
  }

  /* Everything in the sheet a keyboard can reach, in document order, skipping
     anything currently hidden. Recomputed on each Tab because a sheet's
     contents change -- the sign-in sheet swaps an email form for a code form. */
  function focusables(el) {
    var all = el.querySelectorAll(
      'a[href], button:not([disabled]), input:not([type="hidden"]):not([disabled]),' +
      'select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])');
    var out = [];
    for (var i = 0; i < all.length; i++) {
      var n = all[i];
      if (n.offsetWidth || n.offsetHeight || n.getClientRects().length) out.push(n);
    }
    return out;
  }

  function open(id, opts) {
    var target = $(id);
    if (!target) return;
    opts = opts || {};
    if (isOpen(id)) return;

    /* Without {stack:true} this replaces whatever is open, which is what a
       plain sheet switch wants. With it, the new sheet sits on top. */
    if (!opts.stack) hideAll();

    stack.push({ id: id, scrim: opts.scrim !== false, focus: document.activeElement });
    target.hidden = false;
    /* Raise each stacked layer above the one below, from the same base the
       stylesheet uses, so a game does not have to hand-manage z-index. */
    if (stack.length > 1) target.style.zIndex = String(baseZ() + stack.length * 2);
    else target.style.removeProperty('z-index');
    /* One frame between unhiding and adding .on, or the browser has nothing to
       transition from and the sheet simply appears. */
    if (global.requestAnimationFrame) global.requestAnimationFrame(function () { target.classList.add('on'); });
    else target.classList.add('on');

    if (scrimEl) {
      if (wantsScrim()) {
        scrimEl.classList.add('on');
        scrimEl.style.zIndex = stack.length > 1 ? String(baseZ() + stack.length * 2 - 1) : '';
      } else {
        scrimEl.classList.remove('on');
      }
    }
    /* Focus the first real control rather than the dialog itself: a screen
       reader then reads the heading and lands somewhere useful. */
    setTimeout(function () {
      var f = focusables(target);
      if (f.length) f[0].focus();
      else { target.setAttribute('tabindex', '-1'); target.focus(); }
    }, 60);
  }

  function baseZ() {
    var v = parseInt(getVar('--sheet-z'), 10);
    return isNaN(v) ? 31 : v;
  }

  function lower(el) {
    if (!el) return;
    el.classList.remove('on');
    /* Wait for the slide-out before hiding, or it vanishes mid-animation.
       Guarded, because it may have been reopened in the meantime. */
    setTimeout(function () {
      if (!el.classList.contains('on')) { el.hidden = true; el.style.removeProperty('z-index'); }
    }, 440);
  }

  function hideAll() {
    while (stack.length) {
      var top = stack.pop();
      lower($(top.id));
    }
  }

  /* Closes the TOPMOST sheet only, which is what Escape and a scrim tap mean
     when a confirm is sitting over a sheet. */
  function close() {
    var top = stack.pop();
    if (!top) return;
    var el = $(top.id), was = top.id;
    lower(el);
    if (scrimEl) {
      if (wantsScrim()) scrimEl.style.zIndex = stack.length > 1 ? String(baseZ() + stack.length * 2 - 1) : '';
      else { scrimEl.classList.remove('on'); scrimEl.style.removeProperty('z-index'); }
    }
    if (top.focus && top.focus.focus) top.focus.focus();
    for (var j = 0; j < closers.length; j++) { try { closers[j](was); } catch (e) {} }
  }

  function closeAll() { while (stack.length) close(); }

  function toast(msg, ms) {
    if (!toastEl) return;
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('on'); },
                            ms || Number(getVar('--toast-ms')) || 2200);
  }

  function getVar(name) {
    try { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
    catch (e) { return ''; }
  }

  var UI = {
    /* Point the bar's brand link at the right place for this surface. Safe to
       call more than once and safe on a page with no bar. */
    bar: bar,
    init: function (opts) {
      opts = opts || {};
      sheetIds = opts.sheets || [];
      bar();                       /* every surface with a bar wants this */
      scrimEl = opts.scrim ? $(opts.scrim) : null;
      toastEl = opts.toast ? $(opts.toast) : null;

      if (scrimEl) scrimEl.addEventListener('click', close);

      document.addEventListener('keydown', function (e) {
        var id = openId();
        if (!id) return;
        if (e.key === 'Escape') { e.preventDefault(); close(); return; }
        if (e.key !== 'Tab') return;
        var f = focusables($(id));
        if (!f.length) return;
        var first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      });

      /* Anything with data-sheet="fooSheet" opens that sheet; anything with
         data-sheet-close closes. Saves a listener per button in every game. */
      document.addEventListener('click', function (e) {
        var t = e.target.closest ? e.target.closest('[data-sheet],[data-sheet-close]') : null;
        if (!t) return;
        if (t.hasAttribute('data-sheet-close')) { e.preventDefault(); close(); }
        else {
          e.preventDefault();
          open(t.getAttribute('data-sheet'), {
            stack: t.hasAttribute('data-sheet-stack'),
            scrim: !t.hasAttribute('data-sheet-noscrim')
          });
        }
      });
      return UI;
    },
    open: open,
    close: close,
    closeAll: closeAll,
    openId: openId,
    isOpen: isOpen,
    depth: function () { return stack.length; },
    toast: toast,
    /* Called after each close with the id that closed, so a game can resync. */
    onClose: function (fn) { if (typeof fn === 'function') closers.push(fn); }
  };

  /* The bar's brand link. One markup for every surface, so where it points is
     decided here rather than by each surface shipping a different href:
     on the shell it is the About page (the same place the About icon goes),
     and inside a game it is the way back out to the front door. */
  function bar() {
    var a = document.getElementById('psbarBrand');
    if (!a) return;
    var shell = document.documentElement.classList.contains('ps-shell');
    a.setAttribute('href', shell ? '/about/' : '/');
    a.setAttribute('aria-label', shell ? 'About PlaySapien' : 'PlaySapien home');

    /* Analytics: one sheet, wired once here, so no surface has to remember to do
       it and none of them can forget. What it will eventually show differs, so
       the copy does too. */
    var sb = document.getElementById('statsBtn'), body = document.getElementById('statsBody');
    if (body) {
      body.textContent = shell
        ? 'This will show how you are doing across every game, and the leaderboards for all of them. It is not built yet.'
        : 'This will show this game\u2019s leaderboards and how your past rounds have gone. It is not built yet.';
    }
    if (sb && !sb.__wired) {
      sb.__wired = true;
      sb.addEventListener('click', function () { UI.open('statsSheet'); });
    }

    /* Add. Only the shell is wired here — in a game this button is that game's
       own "make a puzzle" control and the game binds it itself. */
    var ab = document.getElementById('addBtn');
    if (shell && ab && !ab.__wired) {
      ab.__wired = true;
      ab.addEventListener('click', function () { UI.open('addSheet'); });
    }
  }

  global.PSUI = UI;
})(typeof window !== 'undefined' ? window : this);
/* ===== END packages/ui/ui.js ===== */
</script>

/* ---------------------------------------------------------------------------
   Audit S5 / S6. Everything between the BEGIN and END markers below is
   `packages/tokens/tokens.css`, INLINED VERBATIM. It is a copy, not a second

/* ===== BEGIN packages/tokens/tokens.css (inlined verbatim — do not edit here) ===== */
/* ===========================================================================
   PlaySapien design tokens — one language, three surfaces.

   THE CONTRACT

   Every surface (the shell and each game) defines the SAME role names. A
   surface differs only in the values it gives them. So a component written
   against `--bg` / `--fg` / `--accent` is portable, and a reader of any
   stylesheet in this repo knows what a name means without looking it up.

   Three themes everywhere: light, dark, and system. One mechanism:

     1. The choice lives in localStorage under `ps:theme` — ONE key, shared by
        all three surfaces, because they are one origin. Choose dark in Word
        Chain and the shell is dark when you navigate back to it.
        Values: "light" | "dark" | "system".
     2. A pre-paint inline script stamps data-theme="light"|"dark" on <html>,
        or removes the attribute for "system". It must run BEFORE first paint
        or the page flashes the wrong theme.
     3. CSS resolves in three blocks, in this order:
          :root                                     light (the base)
          @media (prefers-color-scheme: dark)
            :root:not([data-theme="light"])          system, following dark
          :root[data-theme="dark"]                   explicit dark, wins
        The `:not([data-theme="light"])` is what lets an explicit light choice
        beat a dark system. Leave it out and "light" silently stops working on
        a dark machine.

   THE ROLE NAMES

     Ground        --bg          the page
                   --bg-raise    above the page: sheets, cards, bars
                   --bg-sink     below it: wells, tracks, keycaps
                   --bg-edge     the far end of the ground ramp, for vignettes
     Text          --fg          primary
                   --fg-2        secondary
                   --fg-3        tertiary, hints
                   --fg-on-accent  text sitting on --accent
     Rules         --line        hairline
                   --line-2      a rule you are meant to notice
     Colour        --accent      the surface's signature, SAFE FOR TEXT
                   --accent-soft the same colour as a FILL — decorative only,
                                 never text; it is not contrast-checked
                   --good        success / correct
                   --warn        error / caution
     Effects       --shadow  --scrim
                   --texture-ink    colour of the paper grain overlay
                   --texture-alpha  how strongly the grain shows
     Stage         --stage       a ground that stays DARK IN BOTH THEMES
                   --stage-fg    text that sits on it

   WHY --stage EXISTS

   Sojourner is a lit globe. Its terrain, borders and region fills are a WebGL
   scene whose colours are baked into textures, not CSS — and they are designed
   against black. A light theme that lightened the globe's ground would wreck
   the artwork. So the globe keeps a dark stage in both themes while the chrome
   around it — bar, sheets, prompts, settings — goes light. Dark stage, light
   room, like a gallery. Any surface with artwork that must not re-theme uses
   the same pair.

   CONTRAST

   Every token in the text group clears 4.5:1 against the ground it is used on,
   verified by `packages/tokens/check-contrast.mjs`, which runs in CI. Run it
   after changing any value here. `--accent-soft` is deliberately exempt: it is
   a fill, and the checker skips it by name.

   A NOTE ON THE LIGHT SHELL. Its ground #C5C6C1 is a mid-tone, so there is
   little luminance headroom between primary and tertiary text. --fg-2 and
   --fg-3 are therefore separated by HUE rather than by lightness — one stays
   blue, one goes neutral. They read as different weights without either
   dropping below 4.5:1. This is a constraint of the anchor colour, not an
   oversight.
   =========================================================================== */

/* ---------------------------------------------------------------- type ---- */
:root {
  --f-disp:   "Fraunces", Georgia, "Times New Roman", serif;
  --f-body:   "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;

  --f-script: "Petit Formal Script", "Snell Roundhand", "Apple Chancery", cursive;
  /* A geometric sans, distinct from --f-body, used where the platform speaks in
     its own voice rather than a game's -- currently the shell's tagline.
     NOT the wordmark: PLAYSAPIEN is set in --f-disp (Fraunces), because the
     letterpress proof it is taken from is a serif and Montserrat flattened it.
     Defined here rather than in the shell because a value defined only in an
     inlined copy is overwritten the next time sync-inline runs. */
  --f-sans:   "Montserrat", "Helvetica Neue", Arial, sans-serif;

  /* Sojourner sets display headings at 700, the platform and Word Chain at
     900. Deliberate: a serif at 900 on a black ground closes up, and
     Sojourner's headings sit on black. Both are in the union font url. */
  --w-disp-game:     700;

   Sojourner's own layer comes AFTER the marker block, and is now only the dials

/* ===== BEGIN packages/ui/ui.css (inlined verbatim — do not edit here) ===== */
/* ===========================================================================
   PlaySapien UI — the chrome every game repeats.

   Before this file existed, 715 CSS declarations lived in triplicate: the
   bottom sheet, the scrim, the toast, the corner bar, settings rows, the
   segmented control, buttons, fields. A quarter of every game's stylesheet was
   platform furniture copied by hand, and every copy drifted. That drift is why
   the About icon was stroke-width 2 in one game and 1.9 in another, why the
   corner gap was 9px here and 2px there, and why two of Word Chain's dark
   rules were broken on exactly the "system" setting.

   WHAT THIS FILE IS, AND IS NOT

   It owns STRUCTURE and BEHAVIOUR: geometry, motion, focus, states, and the
   anatomy of each control. It owns no character. Every colour comes from a
   role token, and everything a game might legitimately want to differ on is a
   DIAL — a component token with a default, which a game overrides in its own
   :root.

   So Sojourner's amber full-width buttons and Word Chain's ink pills are both
   this one `.btn`, set differently. They are not two implementations.

   THE DIALS, all optional, all defaulted:

     Sheet     --sheet-pos --sheet-z --sheet-bg --sheet-max-h --sheet-pad
               --sh-title-weight --sh-title-size
     Scrim     --scrim-z
     Toast     --toast-bottom --toast-z --toast-ms
     Icon bar  --icon-btn --icon-stroke --corner-gap --icon-fg --icon-fg-on
               --icon-wash
     Button    --btn-radius --btn-pad --btn-size --btn-fill --btn-fg
               --btn-width --btn-display --btn-ghost-border
     Seg       --seg-radius --seg-track --seg-on
     Settings  --setlabel-font --setlabel-size --setlabel-weight
               --setlabel-tracking --setlabel-case
     Field     --fld-radius

   HOW A GAME USES IT

   Inline this file verbatim after tokens.css, set whatever dials you want in
   your own :root, and write the markup the components expect. That markup is
   documented per component below and in games/_template/.

   Inlined verbatim into every surface; `packages/tokens/check-inline.mjs`
   fails the build if any copy drifts.
   =========================================================================== */

/* ---------------------------------------------------------------- sheet ----
   A bottom sheet on a phone, a centred dialog on a wide screen. Markup:

     <div class="scrim" id="scrim"></div>
     <section class="sheet" id="fooSheet" role="dialog" aria-modal="true"
              aria-labelledby="fooTitle" hidden>
       <div class="sh-head"><h2 id="fooTitle">Foo</h2></div>
       ...
     </section>

   `.on` opens it. ui.js does the rest, including the focus trap that neither
   game had — a keyboard user could tab straight past the scrim into the page
   behind it.
   -------------------------------------------------------------------------- */
.sheet {
  position: var(--sheet-pos, fixed);
  left: 0; right: 0; bottom: 0;
  z-index: var(--sheet-z, 31);
  max-height: var(--sheet-max-h, 86%);
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  background: var(--sheet-bg, var(--bg-raise));
  color: var(--fg);
  border-top: 1px solid var(--line-2);
  border-radius: var(--sheet-radius, 20px) var(--sheet-radius, 20px) 0 0;
  box-shadow: var(--shadow);
  padding: var(--sheet-pad, 20px) var(--sheet-pad, 20px)
           calc(var(--sheet-pad, 20px) + env(safe-area-inset-bottom));
  transform: translateY(102%);
  visibility: hidden;
  pointer-events: none;
  transition: var(--sheet-ease, transform .42s cubic-bezier(.22,.9,.3,1)),
              visibility 0s linear .42s;
}
.sheet.on {
  transform: none;
  visibility: visible;
  pointer-events: auto;
  transition: var(--sheet-ease, transform .42s cubic-bezier(.22,.9,.3,1)),
              visibility 0s;
}
/* the grab handle: 38x4, which all three surfaces had already agreed on */
.sheet::before {
  content: ""; display: block;
  width: 38px; height: 4px; border-radius: 99px;
  background: var(--line-2);
  margin: -6px auto 14px;
}
@media (min-width: 680px) {
  /* On a wide screen a bottom sheet is a strip along the bottom edge with the
     content miles from the pointer. Same element, centred. */
  .sheet {
    left: 50%; right: auto; bottom: auto; top: 50%;
    width: min(560px, 92vw);
    max-height: 84vh;
    border: 1px solid var(--line-2);
    border-radius: var(--sheet-radius, 20px);
    transform: translate(-50%, -46%) scale(.98);
    opacity: 0;
  }
  .sheet.on { transform: translate(-50%, -50%) scale(1); opacity: 1 }
  .sheet::before { display: none }
}
.sh-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 18px }
.sh-head h2 {
  font-family: var(--f-disp); font-weight: var(--sh-title-weight, 900); font-size: var(--sh-title-size, 23px);
  letter-spacing: -.02em; margin: 0; color: var(--fg);
}
.sh-head .sh-sub, .sh-head .donebtn { margin-left: auto }
.sh-head .sh-sub {
  font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .16em;
  text-transform: uppercase; color: var(--fg-3);
}
/* :where() so this contributes ZERO specificity. As `.sheet p` (0-1-1) it beat
   .sethint, .sh-sub and every single-class paragraph rule in both games --
   the documented stylesheet defeating the documented markup. */
:where(.sheet) p { font-size: 14.5px; line-height: 1.62; color: var(--fg-2); margin: 0 0 12px; max-width: 56ch }
:where(.sheet) p.hint { font-size: 13px; line-height: 1.55; color: var(--fg-3) }
.sheet a { color: var(--fg); text-decoration-color: var(--accent); text-underline-offset: 2px }

.scrim {
  position: var(--sheet-pos, fixed); inset: 0;
  z-index: var(--scrim-z, 30);
  background: var(--scrim);
  opacity: 0; pointer-events: none;
  transition: opacity .3s;
}
.scrim.on { opacity: 1; pointer-events: auto }

/* ---------------------------------------------------------------- toast ----
   <div class="toast" id="toast"></div> — ui.js's toast() fills and flashes it.
   -------------------------------------------------------------------------- */
.toast {
  position: var(--sheet-pos, fixed);
  left: 50%; transform: translate(-50%, 8px);
  bottom: calc(var(--toast-bottom, 26px) + env(safe-area-inset-bottom));
  z-index: var(--toast-z, 60);
  max-width: min(84vw, 420px);
  padding: 10px 16px; border-radius: 999px;
  background: var(--fg); color: var(--bg);
  font-size: 13.5px; line-height: 1.4; text-align: center;
  box-shadow: var(--shadow);
  opacity: 0; pointer-events: none;
  transition: opacity .25s, transform .25s;
}
.toast.on { opacity: 1; transform: translate(-50%, 0) }

/* ------------------------------------------------------------ icon bar ----
   The row of round icon buttons. Its POSITION is the game's business — it
   floats over Sojourner's globe and sits in the shell's fixed bar — so this
   file sets only the anatomy.
   -------------------------------------------------------------------------- */
.corner { display: flex; align-items: center; gap: var(--corner-gap, 4px) }
.iconbtn {
  width: var(--icon-btn, 38px); height: var(--icon-btn, 38px);
  flex: none; border: none; padding: 0;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; background: transparent;
  color: var(--icon-fg, var(--fg-2));
  transition: color .16s, background .16s;
}
.iconbtn:hover { color: var(--icon-fg-on, var(--fg)); background: var(--icon-wash, transparent) }
.iconbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; color: var(--icon-fg-on, var(--fg)) }
/* One stroke weight for every corner glyph, set once. Per-glyph attributes
   are what let About drift to 1.9 in one game and 2 in another. */
.corner .iconbtn svg { stroke-width: var(--icon-stroke, 1.8) }

/* --------------------------------------------------------------- button ----
   One anatomy, dialled per game. Sojourner's amber block and Word Chain's ink
   pill are this rule with --btn-radius and --btn-width set differently.
   -------------------------------------------------------------------------- */
.btn {
  display: var(--btn-display, inline-block);
  width: var(--btn-width, auto);
  font-family: var(--f-body); font-size: var(--btn-size, 15px); font-weight: 600;
  line-height: 1.2;
  padding: var(--btn-pad, 12px 20px);
  border: 1px solid transparent;
  border-radius: var(--btn-radius, 999px);
  background: var(--btn-fill, var(--accent));
  color: var(--btn-fg, var(--fg-on-accent));
  cursor: pointer;
  transition: filter .16s, opacity .16s, transform .08s;
}
.btn:hover { filter: brightness(1.06) }
.btn:active { transform: translateY(1px) }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.btn:disabled { opacity: .45; cursor: default; transform: none; filter: none }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--btn-ghost-border, var(--line-2)) }
.btn.ghost:hover { background: var(--icon-wash, transparent); filter: none }
.btnrow { display: flex; gap: 9px; flex-wrap: wrap }

/* ---------------------------------------------------------------- field ---- */
.fld {
  width: 100%; box-sizing: border-box;
  font: inherit;
  font-size: 16px;            /* below 16px iOS zooms the page on focus */
  padding: 11px 13px;
  border-radius: var(--fld-radius, 10px);
  border: 1px solid var(--line-2);
  background: var(--bg-raise); color: var(--fg);
  margin: 0 0 10px;
}
.fld::placeholder { color: var(--fg-3) }
.fld:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent }
.fld.code {
  font-family: var(--f-mono); font-size: 23px; letter-spacing: .34em;
  text-align: center; padding: 12px 13px;
}

/* ------------------------------------------------------------- settings ----
   <div class="setrow">
     <div class="col"><span class="setlabel">Thing</span>
       <p class="sethint">What it does.</p></div>
     <button class="toggle" aria-pressed="false"></button>
   </div>
   -------------------------------------------------------------------------- */
.setrow {
  display: flex; align-items: center; gap: 14px;
  padding: 15px 0;
  border-bottom: 1px solid var(--line);
}
.setrow:last-of-type { border-bottom: 0 }
.setrow .col { flex: 1; min-width: 0 }
.setlabel {
  display: block; color: var(--fg);
  font-family: var(--setlabel-font, var(--f-body));
  font-size: var(--setlabel-size, 15px);
  font-weight: var(--setlabel-weight, 500);
  letter-spacing: var(--setlabel-tracking, normal);
  text-transform: var(--setlabel-case, none);
}
.sethint { margin: 3px 0 0; font-size: 13px; line-height: 1.5; color: var(--fg-3); max-width: 52ch }

.toggle {
  width: 51px; height: 30px; flex: none;
  border: none; border-radius: 999px; cursor: pointer;
  background: var(--bg-sink);
  position: relative; transition: background .22s;
}
.toggle::after {
  content: ""; position: absolute; top: 3px; left: 3px;
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--bg-raise); box-shadow: 0 1px 3px rgba(0,0,0,.28);
  transition: transform .22s;
}
.toggle[aria-pressed="true"] { background: var(--accent) }
.toggle[aria-pressed="true"]::after { transform: translateX(21px) }
.toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

.donebtn {
  background: none; border: none; cursor: pointer;
  font-family: var(--f-mono); font-size: 12.5px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--accent); padding: 6px 2px;
}
.donebtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

/* ------------------------------------------------------------------ seg ----
   A segmented control. Buttons carry aria-pressed and whatever data attribute
   the caller switches on:

     <div class="seg" id="themeSeg" role="group" aria-label="Theme">
       <button type="button" data-theme="light"  aria-pressed="false">Light</button>
       ...

   This is the iOS-style track both Word Chain and the shell had converged on.
   Sojourner's outlined-buttons version is gone; one control, one look.
   -------------------------------------------------------------------------- */
.seg {
  display: flex; gap: 3px; padding: 3px;
  background: var(--seg-track, var(--bg-sink));
  border-radius: var(--seg-radius, 999px);
}
.seg button {
  flex: 1; font: inherit; font-size: 13.5px; font-weight: 600;
  padding: 9px 10px; border: none; cursor: pointer;
  border-radius: calc(var(--seg-radius, 999px) - 3px);
  background: transparent; color: var(--fg-2);
  transition: background .18s, color .18s;
}
.seg button[aria-pressed="true"] {
  background: var(--seg-on, var(--bg-raise));
  color: var(--fg);
  box-shadow: 0 1px 2px rgba(0,0,0,.12);
}
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px }
.seg.grid { display: grid; grid-template-columns: repeat(3, 1fr) }

/* -------------------------------------------------------------- utility ---- */
.ui-note {
  margin: 10px 0 0; padding: 10px 12px; border-radius: 9px;
  font-size: 13px; line-height: 1.5;
  background: var(--bg-sink); color: var(--fg);
}
.ui-note.bad { background: color-mix(in srgb, var(--warn) 16%, transparent) }
.empty {
  text-align: center; padding: 26px 10px; margin: 0 auto;
  font-size: 14px; line-height: 1.6; color: var(--fg-2); max-width: 40ch;
}

/* Both games already zeroed every transition under reduced motion; the shell
   only covered three selectors. One blanket rule, so a new game cannot forget. */
@media (prefers-reduced-motion: reduce) {
  .sheet, .scrim, .toast, .iconbtn, .btn, .toggle, .toggle::after, .seg button {
    transition-duration: .01ms !important;
  }
}

/* ---------------------------------------------------------------- the bar ---
   The platform bar, shared by the shell and every game. Markup lives in
   packages/ui/bar.html; this is only how it looks.

   Fixed, and above every sheet trigger but below the sheets themselves, so a
   dialog still covers it. Nothing may overlap it: content scrolls UNDER, which
   is what .psbar-pad is for -- put it on the scrolling container and the first
   line always clears the bar, including the phone's safe-area inset.
   -------------------------------------------------------------------------- */
.psbar{
  position:fixed; top:0; left:0; right:0; z-index:40;
  display:flex; align-items:center; gap:11px;
  min-height:calc(var(--bar-h,54px) + env(safe-area-inset-top, 0px));
  padding:calc(env(safe-area-inset-top, 0px) + 9px) 14px 9px;
  background:var(--bg);
  border-bottom:1px solid var(--line);
}
/* Anything that scrolls under the bar carries this. */
.psbar-pad{ padding-top:calc(var(--bar-h,54px) + env(safe-area-inset-top, 0px)) }

.psbar-brand{
  display:flex; align-items:center; gap:9px; min-width:0;
  color:var(--fg); text-decoration:none; border-radius:10px;
}
.psbar-brand:focus-visible{ outline:2px solid var(--accent); outline-offset:3px }
.psbar-mark{ width:44px; flex:none; display:block; --mk-w:62 }
/* Set exactly as the landing page sets it: Fraunces, 600 with SAPIEN at 900. */
.psbar-name{
  font-family:var(--f-disp); font-weight:600; font-size:17.5px;
  letter-spacing:-.014em; white-space:nowrap; color:var(--fg);
}
.psbar-name b{ font-weight:900 }
.psbar-gap{ flex:1 }
.psbar-nav{ display:flex; align-items:center; gap:2px; flex:none }

@media (max-width:420px){
  .psbar{ gap:6px; padding-left:10px; padding-right:8px }
  .psbar-mark{ width:36px }
  .psbar-name{ font-size:15.5px }
  .psbar-nav{ gap:0 }
}
/* Below this the wordmark would push the icons off the edge; the mark alone
   still identifies the platform and still goes home. */
@media (max-width:359px){ .psbar-name{ display:none } }
/* ===== END packages/ui/ui.css ===== */

/* ---------------------------------------------------------------------------
   SOJOURNER'S OWN LAYER. Two things live here and nothing else should:

     1. THE DIALS. ui.css owns the anatomy of every platform control and takes
        its character from component tokens. Everything below that is a dial is
        this game keeping its look -- the amber full-width block buttons, the
        sheet that is absolute inside #app rather than fixed, the toast's
        height above the safe area -- without a second implementation of the
        control underneath it.
     2. The parts of Sojourner that ui.css does not own: the globe, the stage,
        the instrument bar, the prompt chip, the two full-page views, and the
        handful of controls (.levelset, .playset, .rng, .selectbox, .brandlink)
        that exist only here.

   The legacy aliases (--ink, --paper, --amber, --verdigris) are GONE. Role
   names only. Anything that needs a colour the roles do not carry derives it
   from a role rather than declaring a literal twice.
   --------------------------------------------------------------------------- */
:root{

  /* ----- DIALS: button ------------------------------------------------------
     Sojourner's buttons are full-width blocks with a squared-off radius, not
     pills. That is character, and every one of these is a ui.css component
     token rather than a rule of our own. --btn-fill / --btn-fg keep their
     defaults (--accent on --fg-on-accent), which is already the amber. */
  --btn-display: block;
  --btn-width: 100%;
  --btn-radius: 11px;
  --btn-pad: 15px 18px;
  --btn-size: 15.5px;

  /* ----- DIALS: sheet, scrim, toast -----------------------------------------
     POSITION is the one that matters. #app is `position:fixed; inset:0` and
     every layer in this game is absolute inside it, so the sheets, the scrim
     and the toast are too; ui.css reads --sheet-pos for all three.

     Z-ORDER. The old file had in-game sheets at 9 and corner panels at 14 with
     the scrim between them at 13 -- which worked only because the two sheet
     systems were separate and the in-game ones never raised a scrim. With one
     system there is one answer: every sheet sits above the scrim. 14/13 keeps
     both below the corner bar (16), which is what lets the bar stay reachable
     while a sheet is up. */
  --sheet-pos: absolute;
  --sheet-z: 14;
  /* two steps of the ground ramp rather than one flat raised surface: the
     gradient is what makes a Sojourner sheet read as lit from its top edge */
  --sheet-bg: linear-gradient(180deg, var(--bg-raise), var(--bg));
  --scrim-z: 13;
  --toast-bottom: 92px;   /* clear of the quit button and the press-hold hint */
  --toast-ms: 1800;

  /* ----- DIALS: icon bar ----------------------------------------------------
     The wash an .iconbtn or a .btn.ghost takes on hover when it is over CHROME.
     The corner bar overrides it with the stage wash while it floats on the
     globe; see .corner below. One literal, used from both places. */
  --chrome-wash: color-mix(in srgb, var(--fg) 10%, transparent);
  --icon-wash: var(--chrome-wash);

  /* ----- the stage's own text ramp -------------------------------------------
     tokens.css gives the stage a ground, one text colour and one rule
     (--stage / --stage-fg / --stage-line). The instrument bar over the globe
     needs the two quieter steps as well -- the round label, the tally
     denominator, the loading line. These are Sojourner-local extensions of the
     shared pair, and like it they are theme-INDEPENDENT: they are the dark
     theme's --fg-2 and --fg-3, frozen, because the ground they sit on is
     frozen. That is the whole point of the stage.
     -------------------------------------------------------------------------- */
  --stage-fg-2: #C3B9AD;
  --stage-fg-3: #A99D8F;
  --stage-wash: rgba(240,232,218,.09);   /* hover wash on the dark stage        */
  /* The stage's signature colour is frozen for the same reason its ink is: the
     round multiplier and the FIND label sit on the globe, so they need the
     amber that was picked against black. Aliasing them to --accent looked
     right and measured 4.02:1 in dark mode, because --accent-soft is a FILL
     and the token file says so in as many words. The sweep caught it. */
  --stage-accent: #E0A44A;

  /* ----- three colours that must FOLLOW the theme but have no role token ------
     Each is DERIVED from a role rather than declared twice, for the same reason
     the aliases are declared once: two literals in two blocks can drift, a
     derivation cannot. color-mix resolves against whichever block won, so each
     of these moves towards the ink of the theme that is actually up -- deeper
     on cream, brighter on black -- and gains contrast in both directions. If a
     browser cannot parse color-mix the property is invalid at computed-value
     time and falls back to the inherited colour, which is legible either way.

     --soj-other is the purple the globe uses for "somebody else's answer"
     (0xAA0FFF in partC.js). The literal #C77BFF it replaces is 4.4:1 on cream:
     a fail, and exactly the kind a rendered contrast sweep catches and a
     reading of the diff does not. */
  --soj-other:       color-mix(in srgb, #AA0FFF, var(--fg) 30%);
  --rule-good:       color-mix(in srgb, var(--good) 38%, transparent);
  --rule-good-strong:color-mix(in srgb, var(--good) 48%, transparent);

  /* ----- the round-shape outlines -------------------------------------------
     shapeSvg() in partD.js paints the five round glyphs, and it writes the
     stroke as a presentation attribute, so the colour has to reach it as a
     custom property. It asked for --amber and --line2, which the legacy-alias
     removal deleted: an undefined var() in an inherited property is invalid at
     computed-value time, `stroke` inherits, nothing above it sets one, and the
     initial value is `none` -- so every un-answered shape has been rendering
     with no outline at all. These are the two roles it wanted. The row appears
     in FOUR places, two of them on the stage, so the stage overrides the pair
     rather than the glyph carrying two spellings. */
  --shape-now:  var(--accent);
  --shape-todo: var(--line-2);

}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
/* THE STAGE / THE ROOM. The ground behind the globe is --stage in both themes,
   because the canvas clears to the same #0C0B0A (partC.js:50) and the terrain,
   borders and region fills are baked against it. Text defaults to --fg, the
   ROOM's ink, because every opaque surface in this file -- sheets, panels, the
   two full-page views -- is chrome and does re-theme. The handful of things
   that float ON the stage set --stage-fg on themselves and let it inherit. */
body{
  margin:0; background:var(--stage); color:var(--fg);
  font-family:var(--f-body); font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overscroll-behavior:none;
  touch-action:none; user-select:none; -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}
#app{position:fixed; inset:0; overflow:hidden}
#glwrap{position:absolute; inset:0}
canvas{display:block; width:100%; height:100%}
/* STAGE: it darkens the corners of the globe itself. Literal, and frozen. */
#vig{position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(120% 90% at 50% 45%,transparent 42%,rgba(9,7,5,.74) 100%)}

/* ---------- top instrument bar ---------- */
/* STAGE. Translucent glass over the artwork: the globe is meant to show
   through it, so it cannot go light without either turning opaque (a slab on
   top of the picture) or producing a contrast that depends on which bit of
   ocean happens to be behind it. It keeps the dark instrument look in both
   themes and sets --stage-fg for its children to inherit. */
.topbar{position:absolute; top:0; left:0; right:0;
  padding:calc(env(safe-area-inset-top) + 10px) 15px 14px;
  display:flex; align-items:flex-start; gap:12px; pointer-events:none; z-index:5;
  color:var(--stage-fg);
  background:linear-gradient(180deg,rgba(9,7,5,.94) 0%,rgba(9,7,5,.8) 45%,rgba(9,7,5,.42) 78%,transparent 100%)}
.tb-left{flex:1; min-width:0; display:flex; flex-direction:column; gap:5px; padding-right:94px}
/* STAGE: the two places the round shapes are drawn on the globe rather than on
   a chrome surface. The glyph itself is one function; only the ramp swaps. */
.topbar,.prompt-chip{--shape-now:var(--stage-accent); --shape-todo:var(--stage-fg-3)}
.shapes{display:flex; align-items:center; gap:7px; height:20px}
.rs{display:block; overflow:visible}
.rs-todo{opacity:.55}
.rs-now{filter:drop-shadow(0 0 7px rgba(224,164,74,.5))}
.res-shapes{display:flex; gap:11px; margin:16px 0 4px}
.res-shapes .rs{width:28px; height:28px}
.eyebrow{font-family:var(--f-mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--fg-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
/* the same class appears inside the About sheet, which is chrome; only the copy
   in the instrument bar is on the stage */
.topbar .eyebrow{color:var(--stage-fg-2)}
.mult{font-family:var(--f-mono); font-size:12.5px; color:var(--stage-accent); letter-spacing:.03em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.chip-foot{display:flex; align-items:center; justify-content:center; gap:14px;
  margin-top:11px; padding-top:10px; border-top:1px solid rgba(140,122,100,.3)}
.chip-score{font-family:var(--f-mono); font-variant-numeric:tabular-nums; font-size:18px;
  line-height:1; color:var(--fg)}
.chip-score .of{font-size:11.5px; color:var(--fg-3); margin-left:1px}
/* the tally appears twice: on the prompt chip (stage) and in the reveal
   sheet's foot (chrome). Only the first is frozen. */
.prompt .chip-score{color:var(--stage-fg)}
.prompt .chip-score .of{color:var(--stage-fg-3)}
.rv-foot{display:flex; align-items:center; justify-content:space-between; gap:14px;
  margin:0 0 15px}

/* ---------- prompt ---------- */
.prompt{position:absolute; left:0; right:0; top:calc(env(safe-area-inset-top) + 92px);
  pointer-events:none; z-index:5; padding:0 16px; display:flex; justify-content:center}
/* STAGE, for the same reason as the bar: it is a pane of smoked glass laid on
   the globe, and the place-name has to be readable against whatever is behind
   it. Setting the colour here is what makes the h1 (which has no colour of its
   own) and every child inherit the stage ink rather than the room's. */
.prompt-chip{display:inline-block; text-align:center; padding:10px 20px 12px; border-radius:16px;
  color:var(--stage-fg);
  background:rgba(12,10,8,.66); border:1px solid rgba(124,106,86,.38);
  backdrop-filter:blur(10px); max-width:min(92vw,560px)}
.prompt .find{font-family:var(--f-mono); font-size:11px; letter-spacing:.22em; text-transform:uppercase;
  color:var(--stage-accent); margin-bottom:6px}
.prompt h1{font-family:var(--f-disp); font-weight:600; font-size:clamp(24px,6.4vw,36px);
  margin:0; line-height:1.12; text-wrap:balance; letter-spacing:-.005em;
  text-shadow:0 2px 18px rgba(0,0,0,.75)}
.prompt .comma{color:var(--stage-fg-2)}
.flagimg{display:block; height:clamp(52px,15vw,74px); width:auto; margin:2px auto 0;
  border-radius:4px; border:1px solid rgba(240,232,218,.28);
  box-shadow:0 6px 20px rgba(0,0,0,.55); background:#0C0B0A}

/* ---------- hold reticle ---------- */
#reticle{position:absolute; width:156px; height:156px; margin:-78px 0 0 -78px; pointer-events:none;
  opacity:0; transition:opacity .12s ease; z-index:4}
#reticle.on{opacity:1}
#reticle svg{display:block; overflow:visible}
.ret-ring{fill:none; stroke:rgba(255,102,0,.34); stroke-width:2.4}
.ret-arc{fill:none; stroke:#FF6600; stroke-width:5.5; stroke-linecap:round;
  transform:rotate(-90deg); transform-origin:78px 78px;
  filter:drop-shadow(0 0 9px rgba(255,102,0,.75))}
.ret-tick{stroke:rgba(255,102,0,.55); stroke-width:1.8}
.ret-dot{fill:#FF6600}

/* STAGE */
.hint{position:absolute; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom) + 68px);
  z-index:5; font-family:var(--f-mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--stage-fg-2); background:rgba(14,12,10,.74); border:1px solid var(--stage-line);
  padding:9px 15px; border-radius:99px; backdrop-filter:blur(8px); pointer-events:none;
  white-space:nowrap; transition:opacity .3s}

/* ---------- sheets ---------- */
/* CHROME. Opaque surfaces you read on -- reveal, story, results bridge, review,
   learn, and the five panels. These are the room, and they re-theme.

   ui.css owns .sheet, .sheet.on, the slide, the grab handle and the wide-screen
   dialog. Sojourner keeps exactly two things about them, and both are character
   rather than anatomy: the GRADIENT ground, two steps of the ramp rather than
   one flat raised surface, which is what makes a Sojourner sheet read as lit
   from its top edge -- that one is dialled, as --sheet-bg, at the top of this
   file -- and the BLUR behind it, which is not a dial and has no reason to be:
   this is the only surface in the platform with moving artwork behind it. */
.sheet{backdrop-filter:blur(18px)}
.sheet.story{max-height:58%; display:flex; flex-direction:column; overflow:hidden}
/* the beat between the phases: the score is the whole message */
/* one beat on the globe before the score page takes over */
/* STAGE: it is painted straight onto the globe, with nothing behind it. */
.timeup{position:absolute; left:50%; top:44%; transform:translate(-50%,-50%) scale(.94);
  z-index:15; font-family:var(--f-disp); font-weight:600; font-size:44px; letter-spacing:-.01em;
  color:var(--stage-fg); text-transform:uppercase; white-space:nowrap; pointer-events:none;
  text-shadow:0 4px 30px rgba(0,0,0,.85), 0 0 60px rgba(0,0,0,.7);
  opacity:0; transition:opacity .22s ease, transform .22s ease}
.timeup.on{opacity:1; transform:translate(-50%,-50%) scale(1)}
#bridgeSheet{text-align:center; padding-top:26px}
.br-label{font-family:var(--f-mono); font-size:17px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--accent); margin-bottom:14px}
.br-score{font-family:var(--f-disp); font-weight:600; font-size:78px; line-height:1;
  color:var(--fg); letter-spacing:-.02em; display:flex; align-items:baseline;
  justify-content:center; gap:12px}
.br-score small{font-family:var(--f-mono); font-size:17px; font-weight:400;
  letter-spacing:.04em; color:var(--fg-3)}
p.br-say{font-family:var(--f-mono); font-size:14.5px; color:var(--fg-2);
  margin:22px 0 24px; line-height:1.6}
/* the walk-through steps between five stories of very different lengths. If the
   buttons sat in the flow they would land somewhere new each time, and a second
   tap at the same spot would miss. The text scrolls; the controls never move. */
.st-body{flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch}
.st-foot{flex:0 0 auto; padding-top:12px; margin-top:2px;
  border-top:1px solid var(--line); background:transparent}
/* CHROME, and the biggest single reason the light theme is worth having: the
   intro and the score page are the two screens with real reading on them, and
   neither shows any part of the globe. The Du Bois emblem on the intro is a
   transparent PNG -- near-black discs, grey land, amber Africa -- which reads
   on cream exactly as the 1900 plate did on paper, so nothing here is baked
   artwork that needs the stage. */
.full{position:absolute; inset:0; z-index:12; background:var(--bg);
  overflow-y:auto; overscroll-behavior:contain; display:none}
.full.on{display:block}
.wrap{max-width:640px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 26px) 20px calc(env(safe-area-inset-bottom) + 40px)}

/* ---------- buttons ---------- */
/* ui.css owns .btn, .btn.ghost, :hover, :active, :focus-visible and :disabled.
   Sojourner's block shape and amber fill come from the dials at the top of this
   file. What is left is two SIZE modifiers ui.css has no opinion about, and the
   focus ring on a bare <a>, which is not a button at all. */
.btn.sm{font-size:13.5px; padding:11px 14px; font-weight:500}
.btn.alt{background:var(--bg-sink); color:var(--fg); border-color:var(--line-2)}
.btn.alt:hover{background:var(--bg-edge); filter:none}
a:focus-visible{outline:2px solid var(--accent); outline-offset:3px}

/* ---------- reveal ---------- */
.rv-top{display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:13px}
.rv-id{min-width:0}
.rv-round{font-family:var(--f-mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--accent); margin-bottom:5px}
.rv-name{font-family:var(--f-disp); font-weight:600; font-size:23px; line-height:1.12; margin:0}
.rv-pts{font-family:var(--f-mono); font-size:30px; font-variant-numeric:tabular-nums;
  color:var(--accent); white-space:nowrap; line-height:1}
.rv-pts small{font-size:11.5px; color:var(--fg-3); display:block; text-align:right;
  letter-spacing:.1em; text-transform:uppercase; margin-top:6px}

/* ---------- corner controls ---------- */
/* ui.css owns the bar's ANATOMY -- .corner's flex row and --corner-gap, the

   many words is the game's business, and its COLOUR RAMP.

   16 and never hides, so during a round it floats on the globe (stage) and on
