# Word Chain / Sojourner deploys entirely on its own. Nothing in this file
# affects any other game, and no other game's build can break this one.
#
# Assets are nested one level deep (cfroot/sojourner/...) because the URL path is
# what Cloudflare looks up inside the assets directory: a request for
# /sojourner/index.html is served from cfroot/sojourner/index.html.

name = "playsapien-sojourner"
compatibility_date = "2026-09-15"

routes = [
  { pattern = "playsapien.com/sojourner/*", zone_name = "playsapien.com" }
]

[assets]
directory = "./cfroot"
not_found_handling = "404-page"

# How this deploys
# ----------------
# Connected to G2campbell/playsapien in the Cloudflare dashboard, so a push to
# main rebuilds and redeploys THIS GAME ONLY. Settings, for the record:
#
#   Build command    sh build.sh
#   Deploy command   npx wrangler deploy
#   Root directory   games/sojourner
#   Include paths    games/sojourner/**, packages/**
#
# The include paths are what keep the games independent: a change to the shell,
# or to the other game, does not rebuild this one. packages/** is there because
# the shared tokens and chrome are inlined at build time, so a change to those
# does need to reach every surface.
#
# Nothing needs to be built by hand. `sh build.sh` locally is only for testing;
# on Windows it needs Git Bash, since PowerShell has no `sh`.
