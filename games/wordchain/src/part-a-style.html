<title>Word Chain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Audit S10: one UNION url across shell, Sojourner and Word Chain, so
     navigating between surfaces hits the font cache instead of re-downloading.
     It is a superset: this game uses Fraunces 900 for its headings and does not
     use Petit Formal Script, but the url must stay byte-identical everywhere or
     the shared cache entry is lost. Do not trim it to what one surface needs. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Petit+Formal+Script&display=swap">
<style>
/* ---------------------------------------------------------------------------
   Word Chain
   Light: ochre. Deliberately outside the NYT Games hues.
   Dark:  Sojourner's ink/paper/amber, so the two games read as a family.

   Layout is three fixed zones - bar, board, keyboard - inside a container sized
   to the visual viewport. The game carries its own keyboard, so the device never
   raises one and nothing ever scrolls out from under the player.
   --------------------------------------------------------------------------- */
:root{
  /* -------------------------------------------------------------------------
     CANONICAL SOURCE: packages/tokens/tokens.css.

     That file is the single definition of the platform palette and of the ROLE
     names below; what follows is a hand-kept copy of the slice Word Chain uses.
     The build SHOULD inline packages/tokens/tokens.css rather than duplicate
     it, and cannot yet: audit S8 — neither build script runs from the repo
     (this one reads a dict.txt that is not checked in). When S8 is fixed,
     replace the two role blocks here with the inlined token file.

     ROLES vs LEGACY NAMES (audit S5)
     --------------------------------
     --bg / --fg / --line / --accent / --good / --shadow are the ROLE names,
     spelled the same way on all three surfaces. --ink / --paper are Word
     Chain's own older names; there are several hundred `var(--ink)` call sites
     so they are kept verbatim and defined as aliases onto the roles.

     *** READ THIS BEFORE TOUCHING THE ALIASES ***
     In WORD CHAIN, --ink is the TEXT and --paper is the BACKGROUND:

         --ink   -> --fg   (text)
         --paper -> --bg   (background)

     In SOJOURNER those two names mean the OPPOSITE — there --ink is the
     background and --paper is the text. That inversion is the entire reason
     the shared token file uses role names at all, and copying an alias line
     between the two games silently inverts one of them. If you are reading
     this because something went inside-out: check the direction here first.

     --clay*, --key*, --tile*, --seg*, --sheet and --scrim are Word Chain's own
     brand ramp. They stay LOCAL and are not candidates for sharing.
     ------------------------------------------------------------------------- */

  /* roles — light. Light is the base theme; the two dark blocks below override
     these same ten names and nothing else. */
  --bg:#FAF9F7; --bg-2:#EFEDE8;
  --fg:#1F1A14; --fg-2:#453C31; --fg-3:#6E6152;
  --line:#DAD5CB; --line-2:#BFB7A9;
  --accent:#9A4A24; --good:#3F6B4A;
  --shadow:0 18px 50px rgba(52,40,20,.2);

  /* legacy names, aliased onto the roles. Declared ONCE, here: a custom
     property substitutes the computed value of --fg/--bg on the same element,
     so these follow the dark blocks automatically and light and dark cannot
     drift apart. Right way round for THIS game — ink is text, paper is
     background. See the warning above. */
  --ink:var(--fg); --ink-2:var(--fg-2); --ink-3:var(--fg-3);
  --paper:var(--bg); --paper-2:var(--bg-2);

  /* Word Chain's own ramp — local, not shared */
  --clay:#D4B072; --clay-deep:#C29C57; --clay-soft:#E4CA96;
  --sheet:#FFFFFF; --scrim:rgba(35,28,18,.44); --segon:#FAF9F7;
  --segtrack:rgba(31,26,20,.14);
  --key:#E7E2D8; --key-press:#D3CBBC;
  --tilebg:var(--clay); --tilefg:var(--ink);

  --f-disp:"Fraunces",Georgia,"Times New Roman",serif;
  --f-body:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --vh:100dvh;
  color-scheme:light;
}
/* Follow the system — but only where the player has not chosen light. The
   `:not([data-theme="light"])` is what lets an explicit light choice beat a
   dark OS; keep it. */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    /* roles — dark */
    --bg:#0C0B0A; --bg-2:#171412;
    --fg:#F0E8DA; --fg-2:#C3B9AD; --fg-3:#A99D8F;
    --line:#38302A; --line-2:#4C423A;
    --accent:#E0A44A; --good:#59B9A4;
    --shadow:0 18px 50px rgba(0,0,0,.55);
    /* --ink/--ink-2/--ink-3/--paper/--paper-2 are NOT redefined here: they are
       aliases declared in :root and they follow the roles above on their own. */

    /* Word Chain's own ramp — local */
    --clay:#17130F; --clay-deep:#0C0B0A; --clay-soft:#241C16;
    --sheet:#171412; --scrim:rgba(6,5,4,.62); --segon:#2E2620;
    --segtrack:rgba(240,232,218,.09);
    --key:#241E19; --key-press:#3A312A;
    --tilebg:#E0A44A; --tilefg:#1A1206;
    color-scheme:dark;
  }
}
/* An explicit choice, stamped on <html> by the pre-paint script at the bottom
   of this file before anything renders. */
:root[data-theme="dark"]{
  /* roles — dark (same ten names as the media block above) */
  --bg:#0C0B0A; --bg-2:#171412;
  --fg:#F0E8DA; --fg-2:#C3B9AD; --fg-3:#A99D8F;
  --line:#38302A; --line-2:#4C423A;
  --accent:#E0A44A; --good:#59B9A4;
  --shadow:0 18px 50px rgba(0,0,0,.55);
  /* --ink/--paper follow via the aliases in :root — do not redefine them here. */

  /* Word Chain's own ramp — local */
  --clay:#17130F; --clay-deep:#0C0B0A; --clay-soft:#241C16;
  --sheet:#171412; --scrim:rgba(6,5,4,.62); --segon:#2E2620;
  --segtrack:rgba(240,232,218,.09);
  --key:#241E19; --key-press:#3A312A;
  --tilebg:#E0A44A; --tilefg:#1A1206;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%; overflow:hidden}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--f-body); font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
}
#app{
  position:fixed; top:0; left:0; right:0; height:var(--vh);
  display:flex; flex-direction:column; overflow:hidden;
}

/* ======================= HOME ======================= */
#home{
  position:fixed; top:0; left:0; right:0; height:var(--vh); z-index:20; background:var(--clay);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:calc(env(safe-area-inset-top) + 28px) 22px calc(env(safe-area-inset-bottom) + 28px);
  text-align:center; overflow-y:auto;
}
.corner{
  position:absolute; top:calc(env(safe-area-inset-top) + 8px); right:10px;
  /* audit S7: the three surfaces had 9px / 2px / 1px. 4px is the agreed middle,
     and is --corner-gap in packages/tokens/tokens.css. */
  display:flex; gap:4px; z-index:2;
}
.corner .iconbtn{color:var(--ink); opacity:.72}
.corner .iconbtn:hover{opacity:1; background:rgba(31,26,20,.09)}
:root[data-theme="dark"] .corner .iconbtn:hover{background:rgba(240,232,218,.09)}
/* Not in the audit, found while doing S7: the dark hover wash above was scoped to
   the EXPLICIT dark choice only, so a player on theme "system" with a dark OS —
   the one path where [data-theme] is absent — got the light wash (a dark ink
   scrim) on a dark ground. Same rule, same value, under the media query. */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .corner .iconbtn:hover{background:rgba(240,232,218,.09)}
}
.brand-mark{color:var(--ink); margin-bottom:14px}
.brand-mark svg{display:block}

/* Audit S7: neither game offered a way back to the platform — #homeBtn goes to
   THIS game's home screen, not to PlaySapien. This is that way out. It mirrors
   .corner on the opposite top edge, and lives on the home screen because that is
   the only screen with a corner bar; during play the bar is #bar and leaving
   mid-round is what the pause dialog is for.
   Quiet on purpose: it is an exit, not a call to action. */
.platform-link{
  position:absolute; top:calc(env(safe-area-inset-top) + 8px); left:10px; z-index:2;
  display:flex; align-items:center; gap:5px; height:38px; padding:0 10px;
  border-radius:999px; text-decoration:none;
  font-family:var(--f-body); font-size:12.5px; font-weight:600;
  letter-spacing:.02em; color:var(--ink); opacity:.52;
  transition:opacity .16s, background .16s;
}
.platform-link svg{display:block; flex:none}
.platform-link:hover{opacity:1; background:rgba(31,26,20,.09)}
:root[data-theme="dark"] .platform-link:hover{background:rgba(240,232,218,.09)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .platform-link:hover{background:rgba(240,232,218,.09)}
}
.platform-link:focus-visible{outline:2px solid var(--accent); outline-offset:1px; opacity:1}
@media (max-width:359px){ .platform-link .plabel{display:none} }
#home h1{
  font-family:var(--f-disp); font-weight:900; font-size:clamp(42px,13vw,60px);
  letter-spacing:-.022em; margin:0 0 6px; line-height:1; color:var(--ink);
}
.tagline{
  font-family:var(--f-disp); font-weight:400; font-size:clamp(19px,5.2vw,24px);
  line-height:1.28; margin:0 0 32px; max-width:16ch; color:var(--ink); text-wrap:balance;
}
.homebtns{display:flex; flex-direction:column; gap:11px; width:min(320px,100%)}
.btn{
  font-family:var(--f-body); font-size:16px; font-weight:600; cursor:pointer;
  border-radius:999px; padding:15px 30px; border:1.5px solid transparent;
  background:var(--ink); color:var(--paper); transition:transform .12s, opacity .16s;
}
.btn:active{transform:scale(.975)}
.btn.ghost{background:transparent; color:var(--ink); border-color:var(--ink)}
.btn:disabled{opacity:.45; cursor:default}
/* greyed but still live: a button that refuses a press should be able to say why */
.btn.off{opacity:.4}
.iconbtn.off{opacity:.32}
.btn:disabled:active{transform:none}
.btn .sub{display:block; font-size:12.5px; font-weight:500; opacity:.72; margin-top:2px}
.home-foot{
  margin-top:26px; font-family:var(--f-disp); font-size:14.5px; line-height:1.6; color:var(--ink);
}
.home-foot .d1{font-weight:600}
.home-foot .d2{opacity:.72}
#homeSolution{
  margin-top:14px; padding-top:13px; border-top:1px solid rgba(31,26,20,.22);
  display:flex; flex-wrap:wrap; justify-content:center; gap:0 9px;
  max-width:320px; margin-left:auto; margin-right:auto;
}
:root[data-theme="dark"] #homeSolution{border-top-color:rgba(240,232,218,.16)}
/* same omission as .corner .iconbtn:hover above — see the note there */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) #homeSolution{border-top-color:rgba(240,232,218,.16)}
}
.solword{
  font-family:var(--f-disp); font-weight:600; font-size:14.5px; letter-spacing:.055em;
  color:var(--ink); display:inline-flex; white-space:nowrap;
}
/* the separator hangs off the word BEFORE it, so a wrap leaves the dot trailing at the
   end of a line rather than orphaned at the start of the next one */
.solword:not(:last-child)::after{content:"\00b7"; opacity:.4; margin-left:9px; font-weight:400}
.reschain .ch.hinted{color:var(--accent)}

/* ======================= BAR ======================= */
#bar{
  flex:none; background:var(--paper); border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;
  display:flex; align-items:center; gap:10px; min-height:56px;
}
.spacer{flex:1}
.iconbtn{
  width:38px; height:38px; border-radius:50%; display:flex; align-items:center;
  justify-content:center; cursor:pointer; color:var(--ink-2);
  background:transparent; border:none; flex:none; transition:background .16s, color .16s;
}
.iconbtn:hover{background:var(--paper-2); color:var(--ink)}
.iconbtn:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
#clock{
  font-family:var(--f-mono); font-size:19px; font-variant-numeric:tabular-nums;
  color:var(--ink); flex:none;
}
#mode{
  font-family:var(--f-mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-3); border:1px solid var(--line); border-radius:999px;
  padding:3px 8px; flex:none;
}
#bankwrap{
  display:flex; align-items:center; gap:5px; color:var(--accent); min-width:0; overflow:hidden;
  font-family:var(--f-mono); font-size:12.5px;
}
#bankicons{display:flex; gap:2px}
#bankicons svg{display:block}
.hintwrap{position:relative; display:flex; align-items:center; flex:none}
.hintbtn{
  display:flex; align-items:center; gap:7px; cursor:pointer; border-radius:999px;
  border:1.5px solid var(--line-2); background:transparent; color:var(--ink);
  font-family:var(--f-body); font-size:13px; font-weight:600; padding:8px 13px 8px 10px;
  transition:background .16s, border-color .16s, opacity .16s;
}
.hintbtn:hover:not(:disabled){background:var(--paper-2); border-color:var(--ink-3)}
.hintbtn:disabled{opacity:.34; cursor:default}
.hintbtn .cost{font-family:var(--f-mono); font-size:12px; color:var(--accent)}
.flash{
  position:absolute; right:100%; margin-right:10px; white-space:nowrap;
  font-family:var(--f-mono); font-size:15px; font-weight:500;
  color:var(--accent); pointer-events:none; opacity:0;
}
.flash.go{animation:flashup .95s ease-out}
@keyframes flashup{
  0%{opacity:0; transform:translateY(2px)} 18%{opacity:1; transform:translateY(-4px)}
  75%{opacity:1; transform:translateY(-12px)} 100%{opacity:0; transform:translateY(-18px)}
}

/* ======================= BOARD ======================= */
#play{flex:1; min-height:0; display:flex; flex-direction:column; background:var(--paper)}
#chainwrap{
  flex:1; min-height:0; overflow-y:auto; padding:12px 16px 16px;
  -webkit-overflow-scrolling:touch; display:flex; flex-direction:column; justify-content:center;
}
#chain{max-width:460px; width:100%; margin:0 auto; display:flex; flex-direction:column; gap:4px; flex:none}
.row{display:flex; align-items:center; gap:0; padding:8px 12px; border-radius:10px; transition:background .2s}
.row .num{
  font-family:var(--f-mono); font-size:11px; color:var(--ink-3); width:15px;
  flex:none; text-align:right; opacity:.6; margin-right:10px;
}
.word,#typed{
  font-family:var(--f-disp); font-weight:600; font-size:clamp(20px,5.6vw,26px);
  letter-spacing:.055em; line-height:1.15; display:flex; gap:.055em;
  color:var(--ink); flex:0 0 auto; flex-wrap:nowrap; white-space:nowrap;
}
.ch{display:inline-block}
.ch.hinted{color:var(--accent)}
/* a letter bought with a Lifeline stays marked for the life of the chain, not just
   while its word is the active one */
.solutionline .ch.hinted{color:var(--accent)}
.row.solved,.row.given{background:var(--paper-2)}
.row.current{box-shadow:inset 0 0 0 2px var(--ink)}
.row.pending .word{color:var(--line-2)}
.row.pending .word .ch:first-child{color:var(--ink-3)}
.tickmark{margin-left:auto; color:var(--good); flex:none; display:flex}
.givenlab{
  margin-left:auto; font-family:var(--f-mono); font-size:9.5px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); flex:none;
}

/* the caret and the submit arrow ride the active row */
#editwrap{display:flex; align-items:center; gap:0; flex:1 1 auto; min-width:0}
#typed.fading{opacity:0; transition:opacity .24s ease}
#typed.dim{opacity:.45}
#caret{
  width:2px; height:clamp(22px,6vw,29px); background:var(--accent); flex:none;
  margin-left:1px; animation:blink 1.1s step-end infinite;
}
#caret.off{opacity:0; animation:none}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
#go{
  flex:none; margin-left:auto; width:34px; height:34px; border-radius:9px; border:none;
  cursor:pointer; background:var(--ink); color:var(--paper);
  display:flex; align-items:center; justify-content:center; transition:opacity .16s, transform .12s;
}
#go:active{transform:scale(.94)}
#go:disabled{opacity:.35}
#msg{
  font-family:var(--f-disp); font-size:15px; line-height:1.32; color:var(--accent);
  padding:5px 12px 0 37px; min-height:20px; max-width:460px; margin:0 auto; width:100%;
  text-wrap:balance; flex:none;
}
#msg.good{color:var(--good); font-weight:600}
.thinking{display:inline-flex; gap:4px; align-items:center; height:20px}
.thinking i{width:5px; height:5px; border-radius:50%; background:var(--ink-3); display:block;
  animation:pulse 1.1s infinite ease-in-out}
.thinking i:nth-child(2){animation-delay:.16s}
.thinking i:nth-child(3){animation-delay:.32s}
@keyframes pulse{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* ======================= KEYBOARD ======================= */
#kb{
  flex:none; background:var(--paper-2); border-top:1px solid var(--line);
  padding:7px 4px calc(env(safe-area-inset-bottom) + 7px);
  display:flex; flex-direction:column; gap:6px; touch-action:manipulation;
}
.kbrow{display:flex; gap:5px; justify-content:center}
.key{
  flex:1 1 0; max-width:46px; height:46px; border:none; border-radius:6px; cursor:pointer;
  background:var(--key); color:var(--ink); font-family:var(--f-body); font-size:16px;
  font-weight:600; display:flex; align-items:center; justify-content:center; padding:0;
  transition:background .1s, transform .06s; min-width:0;
}
.key:active,.key.hit{background:var(--key-press); transform:scale(.94)}
.key.wide{flex:1.55 1 0; max-width:70px; font-size:12px; letter-spacing:.06em}
.key.wide svg{display:block}
.key:disabled{opacity:.4; cursor:default}
#kb.off{opacity:.45; pointer-events:none}
@media (min-height:760px){
  .key{height:52px; max-width:50px}
  .key.wide{max-width:76px}
}
@media (min-width:620px){
  #kb{padding-left:0; padding-right:0}
  .kbrow{max-width:560px; margin:0 auto; width:100%}
}

/* ======================= COMPOSER ======================= */
/* A page, not a card: it is a working surface like the board, so it gets the same three
   zones and the same keyboard rather than a sheet that floats over the home screen. */
#compose{
  position:fixed; top:0; left:0; right:0; height:var(--vh); z-index:22;
  background:var(--paper); display:flex; flex-direction:column; overflow:hidden;
}
#cbar{
  flex:none; background:var(--paper); border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;
  display:flex; align-items:center; gap:6px; min-height:56px;
}
#cTitle{
  font-family:var(--f-mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-3); margin-left:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.btn.small{
  padding:9px 20px; font-size:14px; border-radius:999px; flex:none;
}
#cbody{
  flex:1; min-height:0; overflow-y:auto; padding:12px 16px 8px;
  display:flex; flex-direction:column; justify-content:center;
}
#cRows{max-width:460px; width:100%; margin:0 auto; display:flex; flex-direction:column; gap:4px; flex:none}
.crow{
  display:flex; align-items:center; gap:0; padding:8px 12px; border-radius:10px;
  cursor:pointer; background:var(--paper-2); transition:background .16s, box-shadow .16s;
}
.crow.on{background:transparent; box-shadow:inset 0 0 0 2px var(--ink)}
.crow.short{box-shadow:inset 0 0 0 1px var(--accent)}
.crow.on.short{box-shadow:inset 0 0 0 2px var(--accent)}
.crow .num{
  font-family:var(--f-mono); font-size:11px; color:var(--ink-3); width:15px;
  flex:none; text-align:right; opacity:.6; margin-right:10px;
}
.cword{
  font-family:var(--f-disp); font-weight:600; font-size:clamp(20px,5.6vw,26px);
  letter-spacing:.055em; line-height:1.15; color:var(--ink); display:flex; gap:.055em;
  white-space:nowrap; min-height:1.15em;
}
.ccaret{
  width:2px; height:clamp(22px,6vw,29px); background:var(--accent); flex:none; margin-left:1px;
  animation:blink 1.1s step-end infinite;
}
#cHint{
  flex:none; padding:0 16px 10px; max-width:460px; margin:0 auto; width:100%;
  font-family:var(--f-disp); font-size:13.5px; line-height:1.35; color:var(--ink-3);
  text-wrap:balance; min-height:19px;
}
#cHint.warn{color:var(--accent)}

/* my chains */
.mine-row{
  display:flex; align-items:center; gap:10px; padding:11px 0;
  border-bottom:1px solid var(--line);
}
.mine-txt{flex:1; min-width:0}
.mine-first{
  font-family:var(--f-disp); font-weight:600; font-size:15px; letter-spacing:.05em; color:var(--ink);
}
.mine-rest{
  font-family:var(--f-mono); font-size:11.5px; letter-spacing:.08em; color:var(--ink-3);
  margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.mine-acts{display:flex; gap:0; flex:none}
.mine-acts .iconbtn{width:34px; height:34px}
.mine-acts .iconbtn.danger:hover{color:var(--accent)}
.mine-tag{
  font-family:var(--f-mono); font-size:9px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-3); border:1px solid var(--line); border-radius:999px; padding:2px 7px;
  flex:none; margin-left:6px;
}
.mine-head{
  font-family:var(--f-mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-3); margin:20px 0 4px;
}

/* send to friends */
.findrow{display:flex; align-items:center; gap:6px; margin-bottom:6px}
#friendFind{
  flex:1; min-width:0; font-family:var(--f-body); font-size:15px; padding:11px 14px;
  border-radius:10px; border:1.5px solid var(--line-2); background:var(--paper);
  color:var(--ink); outline:none; user-select:text; -webkit-user-select:text;
}
#friendFind:focus{border-color:var(--ink)}
.fr-row{
  display:flex; align-items:center; gap:11px; padding:11px 0;
  border-bottom:1px solid var(--line); cursor:pointer;
}
.fr-box{
  width:21px; height:21px; border-radius:6px; border:1.5px solid var(--line-2); flex:none;
  display:flex; align-items:center; justify-content:center; color:var(--paper);
}
.fr-row[aria-checked="true"] .fr-box{background:var(--accent); border-color:var(--accent)}
.fr-row[aria-checked="true"] .fr-box svg{display:block}
.fr-box svg{display:none}
.fr-name{font-size:14.5px; color:var(--ink); flex:1; min-width:0}
.fr-kind{
  font-family:var(--f-mono); font-size:9px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-3); flex:none;
}
.fr-empty{
  border:1px dashed var(--line-2); border-radius:12px; padding:22px 16px; text-align:center;
  color:var(--ink-3); font-size:13.5px; line-height:1.5; margin-top:8px;
}

#confirm{
  position:fixed; inset:0; z-index:46; display:flex; align-items:center; justify-content:center;
  padding:24px; background:var(--scrim);
}

/* ======================= SHEETS ======================= */
#scrim{
  position:fixed; inset:0; background:var(--scrim); z-index:30; opacity:0;
  pointer-events:none; transition:opacity .3s;
}
#scrim.on{opacity:1; pointer-events:auto}
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:31; background:var(--sheet);
  border-top:1px solid var(--line); border-radius:20px 20px 0 0; box-shadow:var(--shadow);
  padding:18px 20px calc(env(safe-area-inset-bottom) + 22px);
  max-height:86%; overflow-y:auto; overscroll-behavior:contain;
  transform:translateY(102%); transition:transform .42s cubic-bezier(.22,.9,.3,1);
  visibility:hidden; pointer-events:none; user-select:text; -webkit-user-select:text;
}
.sheet.up{transform:translateY(0); visibility:visible; pointer-events:auto}
.sheet::before{
  content:""; display:block; width:38px; height:4px; border-radius:99px;
  background:var(--line-2); margin:-4px auto 16px;
}
.sheet-in{max-width:520px; margin:0 auto}
.sh-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px}
.sh-head h2{font-family:var(--f-disp); font-weight:600; font-size:23px; margin:0}
.donebtn{
  background:none; border:none; cursor:pointer; font-family:var(--f-mono);
  font-size:12px; letter-spacing:.13em; text-transform:uppercase; color:var(--accent); padding:4px;
}
.setrow{padding:15px 0; border-top:1px solid var(--line)}
.setrow:last-child{border-bottom:1px solid var(--line)}
.setrow.flex{display:flex; align-items:center; justify-content:space-between; gap:16px}
.setlabel{
  font-family:var(--f-mono); font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin-bottom:9px;
}
.setrow.flex .setlabel{margin-bottom:2px}
.sethint{font-size:13.5px; color:var(--ink-3); line-height:1.5; margin:8px 0 0; max-width:54ch}
.seg{display:flex; background:var(--segtrack); border-radius:11px; padding:4px; gap:3px}
.seg button{
  flex:1; cursor:pointer; border:none; background:transparent; border-radius:8px;
  font-family:var(--f-body); font-size:13px; font-weight:500; color:var(--ink);
  padding:8px 14px; transition:background .16s; opacity:.72;
}
.seg button[aria-pressed="true"]{
  background:var(--segon); opacity:1; font-weight:600; box-shadow:0 1px 3px rgba(40,25,16,.18);
}
.toggle{
  width:50px; height:29px; border-radius:99px; background:var(--line);
  border:1px solid var(--line-2); cursor:pointer; padding:0; position:relative; flex:none;
  transition:background .22s, border-color .22s;
}
.toggle i{
  position:absolute; top:3px; left:3px; width:21px; height:21px; border-radius:50%;
  background:var(--paper); transition:transform .22s;
}
.toggle[aria-checked="true"]{background:var(--accent); border-color:var(--accent)}
.toggle[aria-checked="true"] i{transform:translateX(21px)}
.sheet p{font-size:14.5px; line-height:1.62; color:var(--ink-2)}
.sheet h3{font-family:var(--f-disp); font-weight:600; font-size:16px; margin:20px 0 6px}
.soon{font-family:var(--f-disp); font-weight:600; font-size:20px; margin:0 0 6px}
.emptybox{border:1px dashed var(--line-2); border-radius:12px; padding:26px 18px; text-align:center; margin-top:6px}
.emptybox svg{color:var(--line-2); margin-bottom:10px}
.exchain{font-family:var(--f-disp); font-weight:600; letter-spacing:.05em; font-size:15px;
  color:var(--ink); line-height:1.7; margin:6px 0 0}
.exchain .sep{color:var(--line-2); font-weight:400}
.bests{display:flex; gap:8px}
.best{flex:1; border:1px solid var(--line); border-radius:11px; padding:11px 8px; text-align:center}
.best .bl{display:block; font-family:var(--f-mono); font-size:9.5px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin-bottom:5px}
.best .bt{display:block; font-family:var(--f-mono); font-size:18px; color:var(--ink);
  font-variant-numeric:tabular-nums}
.hist{display:flex; flex-direction:column}
.hrow{display:flex; align-items:baseline; gap:10px; padding:9px 0;
  border-bottom:1px solid var(--line); font-size:13.5px}
.hrow .hl{font-family:var(--f-mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-3); width:62px; flex:none}
.hrow .hc{font-family:var(--f-disp); font-weight:600; letter-spacing:.04em; color:var(--ink-2);
  flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.hrow .ht{font-family:var(--f-mono); font-size:12.5px; color:var(--ink); flex:none;
  font-variant-numeric:tabular-nums}

/* ======================= PAUSE ======================= */
#app.paused #bar, #app.paused #play, #app.paused #kb{filter:blur(5px); pointer-events:none}
#pause{
  position:fixed; inset:0; z-index:45; display:flex; align-items:center; justify-content:center;
  padding:24px; background:var(--scrim);
}
.pausecard{
  background:var(--sheet); border-radius:18px; box-shadow:var(--shadow);
  padding:28px 24px 22px; max-width:360px; width:100%; text-align:center;
}
.pauseq{font-family:var(--f-disp); font-weight:600; font-size:21px; line-height:1.3;
  margin:0 0 20px; color:var(--ink); text-wrap:balance}
.pausebtns{display:flex; flex-direction:column; gap:9px}
.pausebtns .btn{width:100%; padding:14px 18px; font-size:15px}

/* ======================= RESULTS ======================= */
#results{
  position:fixed; inset:0; z-index:40; display:flex; align-items:center; justify-content:center;
  padding:22px; background:var(--scrim); opacity:0; pointer-events:none; transition:opacity .3s;
}
#results.on{opacity:1; pointer-events:auto}
.rescard{
  background:var(--sheet); border-radius:18px; box-shadow:var(--shadow);
  padding:30px 26px 26px; max-width:400px; width:100%; text-align:center;
  transform:translateY(14px) scale(.98); transition:transform .34s cubic-bezier(.22,.9,.3,1);
  max-height:100%; overflow-y:auto;
}
#results.on .rescard{transform:none}
.restile{
  width:58px; height:58px; border-radius:13px; background:var(--tilebg);
  display:flex; align-items:center; justify-content:center; margin:0 auto 16px; color:var(--tilefg);
}
.rescard h2{font-family:var(--f-disp); font-weight:900; font-size:32px; margin:0 0 10px; letter-spacing:-.015em}
.resline{font-family:var(--f-disp); font-size:17.5px; line-height:1.45; margin:0; color:var(--ink)}
.resline b{font-weight:600}
.resbreak{font-family:var(--f-mono); font-size:12.5px; color:var(--ink-3); margin:8px 0 0;
  font-variant-numeric:tabular-nums}
.reschain{font-family:var(--f-disp); font-weight:600; font-size:13.5px; letter-spacing:.05em;
  line-height:1.75; color:var(--ink-2); margin:18px 0 4px; text-wrap:balance}
.reschain .sep{color:var(--line-2); font-weight:400}
.resbtns{display:flex; flex-direction:column; gap:9px; margin-top:20px}
.resbtns .btn{width:100%; padding:14px 20px; font-size:15px}
.toast{
  position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom) + 26px);
  z-index:50; background:var(--ink); color:var(--paper); font-family:var(--f-body);
  font-size:13.5px; font-weight:500; padding:11px 20px; border-radius:999px;
  opacity:0; pointer-events:none; transition:opacity .25s; box-shadow:var(--shadow);
  max-width:88vw; text-align:center;
}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important; animation-duration:.01ms !important}
}
</style>
<script>
/* Light is the default. Stamp it before anything paints, so a dark-OS device does not
   flash the dark palette while the app script loads. An explicit choice overrides it. */
(function () {
  var t = 'light';
  try { var v = JSON.parse(localStorage.getItem('wordchain:set') || '{}'); if (v.theme) t = v.theme; } catch (e) {}
  if (t === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  /* size the app to the visual viewport, so browser chrome never crops the keyboard */
  function vh() {
    var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    document.documentElement.style.setProperty('--vh', h + 'px');
  }
  vh();
  window.addEventListener('resize', vh);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', vh);
    window.visualViewport.addEventListener('scroll', vh);
  }
})();
</script>
