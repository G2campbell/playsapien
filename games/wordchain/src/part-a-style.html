/* ---------------------------------------------------------------------------
   Word Chain
   Light: dusty rose on #E8D1DA. Dark: deep plum on #3C2F34.
   Was a clay ochre, which sat too close to Sojourner's amber — side by side on
   the shell's game rail the two read as one product. The anchors and the whole
   derived palette now come from packages/tokens/tokens.css (.wc-game).

   Layout is three fixed zones - bar, board, keyboard - inside a container sized
   to the visual viewport. The game carries its own keyboard, so the device never
   raises one and nothing ever scrolls out from under the player.

/* ===========================================================================
   PlaySapien design tokens — one language, three surfaces.

   THE CONTRACT

   Every surface (the shell and each game) defines the SAME role names. A
   surface differs only in the values it gives them. So a component written
   against `--bg` / `--fg` / `--accent` is portable, and a reader of any
   stylesheet in this repo knows what a name means without looking it up.

   Three themes everywhere: light, dark, and system. One mechanism:

     1. The choice lives in localStorage under `ps:theme` — ONE key, shared by
        all three surfaces, because they are one origin. Choose dark in Word
        Chain and the shell is dark when you navigate back to it.
        Values: "light" | "dark" | "system".
     2. A pre-paint inline script stamps data-theme="light"|"dark" on <html>,
        or removes the attribute for "system". It must run BEFORE first paint
        or the page flashes the wrong theme.
     3. CSS resolves in three blocks, in this order:
          :root                                     light (the base)
          @media (prefers-color-scheme: dark)
            :root:not([data-theme="light"])          system, following dark
          :root[data-theme="dark"]                   explicit dark, wins
        The `:not([data-theme="light"])` is what lets an explicit light choice
        beat a dark system. Leave it out and "light" silently stops working on
        a dark machine.

   THE ROLE NAMES

     Ground        --bg          the page
                   --bg-raise    above the page: sheets, cards, bars
                   --bg-sink     below it: wells, tracks, keycaps
                   --bg-edge     the far end of the ground ramp, for vignettes
     Text          --fg          primary
                   --fg-2        secondary
                   --fg-3        tertiary, hints
                   --fg-on-accent  text sitting on --accent
     Rules         --line        hairline
                   --line-2      a rule you are meant to notice
     Colour        --accent      the surface's signature, SAFE FOR TEXT
                   --accent-soft the same colour as a FILL — decorative only,
                                 never text; it is not contrast-checked
                   --good        success / correct
                   --warn        error / caution
     Effects       --shadow  --scrim
                   --texture-ink    colour of the paper grain overlay
                   --texture-alpha  how strongly the grain shows
     Stage         --stage       a ground that stays DARK IN BOTH THEMES
                   --stage-fg    text that sits on it

   WHY --stage EXISTS

   Sojourner is a lit globe. Its terrain, borders and region fills are a WebGL
   scene whose colours are baked into textures, not CSS — and they are designed
   against black. A light theme that lightened the globe's ground would wreck
   the artwork. So the globe keeps a dark stage in both themes while the chrome
   around it — bar, sheets, prompts, settings — goes light. Dark stage, light
   room, like a gallery. Any surface with artwork that must not re-theme uses
   the same pair.

   CONTRAST

   Every token in the text group clears 4.5:1 against the ground it is used on,
   verified by `packages/tokens/check-contrast.mjs`, which runs in CI. Run it
   after changing any value here. `--accent-soft` is deliberately exempt: it is
   a fill, and the checker skips it by name.

   A NOTE ON THE LIGHT SHELL. Its ground #C5C6C1 is a mid-tone, so there is
   little luminance headroom between primary and tertiary text. --fg-2 and
   --fg-3 are therefore separated by HUE rather than by lightness — one stays
   blue, one goes neutral. They read as different weights without either
   dropping below 4.5:1. This is a constraint of the anchor colour, not an
   oversight.
   =========================================================================== */

/* ---------------------------------------------------------------- type ---- */
:root {
  --f-disp:   "Fraunces", Georgia, "Times New Roman", serif;
  --f-body:   "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --f-mono:   "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --f-script: "Petit Formal Script", "Snell Roundhand", "Apple Chancery", cursive;
  /* REMOVED: --f-sans (Montserrat). It existed for one line -- the shell's
     tagline -- which is Fraunces now, so nothing on the platform spoke in a
     second sans and no surface loads the face any more. Reinstating it means
     adding Montserrat back to the font url in ALL THREE surfaces, not just
     the one using it, or the shared cache entry is lost. */

  /* Sojourner sets display headings at 700, the platform and Word Chain at
     900. Deliberate: a serif at 900 on a black ground closes up, and
     Sojourner's headings sit on black. Both are in the union font url. */
  --w-disp-game:     700;
  --w-disp-platform: 900;

  /* ------------------------------------------------------------ metrics -- */
  --bar-h: 58px;
  --icon-btn: 38px;
  --icon-stroke: 1.8;
  --corner-gap: 4px;
  --sheet-radius: 20px;
  --sheet-ease: transform .42s cubic-bezier(.22,.9,.3,1);

  /* ---------------------------------------------------------- attention --
     The one colour used to say "there is something here you have not
     noticed". It is the blue of PLAY in the wordmark, so the nudge is in the
     brand's own voice rather than a generic alert red.

     Declared HERE, in the shared root, rather than beside --lockup-play in
     .ps-shell: the games do not carry the shell's palette, so a game reading
     var(--lockup-play) would get nothing at all -- and a var() naming an
     undefined variable does not fall back, it invalidates the property.
     Every surface needs this one, so it lives where every surface can see it. */
  --attn: #62768a;
}
/* The same blue is too dark to read on a dark ground; this is the wordmark's
   own dark-theme value. Set on :root so it applies whichever palette class the
   surface is using. */
:root[data-theme="dark"] { --attn: #93A7B8 }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --attn: #93A7B8 }
}

/* ===========================================================================
   PlaySapien UI — the chrome every game repeats.

   Before this file existed, 715 CSS declarations lived in triplicate: the
   bottom sheet, the scrim, the toast, the corner bar, settings rows, the
   segmented control, buttons, fields. A quarter of every game's stylesheet was
   platform furniture copied by hand, and every copy drifted. That drift is why
   the About icon was stroke-width 2 in one game and 1.9 in another, why the
   corner gap was 9px here and 2px there, and why two of Word Chain's dark
   rules were broken on exactly the "system" setting.

   WHAT THIS FILE IS, AND IS NOT

   It owns STRUCTURE and BEHAVIOUR: geometry, motion, focus, states, and the
   anatomy of each control. It owns no character. Every colour comes from a
   role token, and everything a game might legitimately want to differ on is a
   DIAL — a component token with a default, which a game overrides in its own
   :root.

   So Sojourner's amber full-width buttons and Word Chain's ink pills are both
   this one `.btn`, set differently. They are not two implementations.

   THE DIALS, all optional, all defaulted:

     Sheet     --sheet-pos --sheet-z --sheet-bg --sheet-max-h --sheet-pad
               --sh-title-weight --sh-title-size
     Scrim     --scrim-z
     Toast     --toast-bottom --toast-z --toast-ms
     Icon bar  --icon-btn --icon-stroke --corner-gap --icon-fg --icon-fg-on
               --icon-wash
     Button    --btn-radius --btn-pad --btn-size --btn-fill --btn-fg
               --btn-width --btn-display --btn-ghost-border
     Seg       --seg-radius --seg-track --seg-on
     Settings  --setlabel-font --setlabel-size --setlabel-weight
               --setlabel-tracking --setlabel-case
     Field     --fld-radius

   HOW A GAME USES IT

   Inline this file verbatim after tokens.css, set whatever dials you want in
   your own :root, and write the markup the components expect. That markup is
   documented per component below and in games/_template/.

   Inlined verbatim into every surface; `packages/tokens/check-inline.mjs`
   fails the build if any copy drifts.
   =========================================================================== */

/* ---------------------------------------------------------------- sheet ----
   A bottom sheet on a phone, a centred dialog on a wide screen. Markup:

     <div class="scrim" id="scrim"></div>
     <section class="sheet" id="fooSheet" role="dialog" aria-modal="true"
              aria-labelledby="fooTitle" hidden>
       <div class="sh-head"><h2 id="fooTitle">Foo</h2></div>
       ...
     </section>

   `.on` opens it. ui.js does the rest, including the focus trap that neither
   game had — a keyboard user could tab straight past the scrim into the page
   behind it.
   -------------------------------------------------------------------------- */
.sheet {
  position: var(--sheet-pos, fixed);
  left: 0; right: 0; bottom: 0;
  z-index: var(--sheet-z, 31);
  max-height: var(--sheet-max-h, 86%);
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  background: var(--sheet-bg, var(--bg-raise));
  color: var(--fg);
  border-top: 1px solid var(--line-2);
  border-radius: var(--sheet-radius, 20px) var(--sheet-radius, 20px) 0 0;
  box-shadow: var(--shadow);
  padding: var(--sheet-pad, 20px) var(--sheet-pad, 20px)
           calc(var(--sheet-pad, 20px) + env(safe-area-inset-bottom));
  transform: translateY(102%);
  visibility: hidden;
  pointer-events: none;
  transition: var(--sheet-ease, transform .42s cubic-bezier(.22,.9,.3,1)),
              visibility 0s linear .42s;
}
.sheet.on {
  transform: none;
  visibility: visible;
  pointer-events: auto;
  transition: var(--sheet-ease, transform .42s cubic-bezier(.22,.9,.3,1)),
              visibility 0s;
}
/* the grab handle: 38x4, which all three surfaces had already agreed on */
.sheet::before {
  content: ""; display: block;
  width: 38px; height: 4px; border-radius: 99px;
  background: var(--line-2);
  margin: -6px auto 14px;
}
@media (min-width: 680px) {
  /* On a wide screen a bottom sheet is a strip along the bottom edge with the
     content miles from the pointer. Same element, centred. */
  .sheet {
    left: 50%; right: auto; bottom: auto; top: 50%;
    width: min(560px, 92vw);
    max-height: 84vh;
    border: 1px solid var(--line-2);
    border-radius: var(--sheet-radius, 20px);
    transform: translate(-50%, -46%) scale(.98);
    opacity: 0;
  }
  .sheet.on { transform: translate(-50%, -50%) scale(1); opacity: 1 }
  .sheet::before { display: none }
}
.sh-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 18px }
.sh-head h2 {
  font-family: var(--f-disp); font-weight: var(--sh-title-weight, 900); font-size: var(--sh-title-size, 23px);
  letter-spacing: -.02em; margin: 0; color: var(--fg);
}
.sh-head .sh-sub, .sh-head .donebtn { margin-left: auto }
.sh-head .sh-sub {
  font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .16em;
  text-transform: uppercase; color: var(--fg-3);
}
/* :where() so this contributes ZERO specificity. As `.sheet p` (0-1-1) it beat
   .sethint, .sh-sub and every single-class paragraph rule in both games --
   the documented stylesheet defeating the documented markup. */
:where(.sheet) p { font-size: 14.5px; line-height: 1.62; color: var(--fg-2); margin: 0 0 12px; max-width: 56ch }
:where(.sheet) p.hint { font-size: 13px; line-height: 1.55; color: var(--fg-3) }
.sheet a { color: var(--fg); text-decoration-color: var(--accent); text-underline-offset: 2px }

.scrim {
  position: var(--sheet-pos, fixed); inset: 0;
  z-index: var(--scrim-z, 30);
  background: var(--scrim);
  opacity: 0; pointer-events: none;
  transition: opacity .3s;
}
.scrim.on { opacity: 1; pointer-events: auto }

/* ---------------------------------------------------------------- toast ----
   <div class="toast" id="toast"></div> — ui.js's toast() fills and flashes it.
   -------------------------------------------------------------------------- */
.toast {
  position: var(--sheet-pos, fixed);
  left: 50%; transform: translate(-50%, 8px);
  bottom: calc(var(--toast-bottom, 26px) + env(safe-area-inset-bottom));
  z-index: var(--toast-z, 60);
  max-width: min(84vw, 420px);
  padding: 10px 16px; border-radius: 999px;
  background: var(--fg); color: var(--bg);
  font-size: 13.5px; line-height: 1.4; text-align: center;
  box-shadow: var(--shadow);
  opacity: 0; pointer-events: none;
  transition: opacity .25s, transform .25s;
}
.toast.on { opacity: 1; transform: translate(-50%, 0) }

/* ------------------------------------------------------------ icon bar ----
   The row of round icon buttons. Its POSITION is the game's business — it
   floats over Sojourner's globe and sits in the shell's fixed bar — so this
   file sets only the anatomy.
   -------------------------------------------------------------------------- */
.corner { display: flex; align-items: center; gap: var(--corner-gap, 4px) }
.iconbtn {
  width: var(--icon-btn, 38px); height: var(--icon-btn, 38px);
  flex: none; border: none; padding: 0;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; background: transparent;
  color: var(--icon-fg, var(--fg-2));
  transition: color .16s, background .16s;
}
.iconbtn:hover { color: var(--icon-fg-on, var(--fg)); background: var(--icon-wash, transparent) }
.iconbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; color: var(--icon-fg-on, var(--fg)) }
/* One stroke weight for every corner glyph, set once. Per-glyph attributes
   are what let About drift to 1.9 in one game and 2 in another. */
.corner .iconbtn svg { stroke-width: var(--icon-stroke, 1.8) }

/* --------------------------------------------------------------- button ----
   One anatomy, dialled per game. Sojourner's amber block and Word Chain's ink
   pill are this rule with --btn-radius and --btn-width set differently.
   -------------------------------------------------------------------------- */
.btn {
  display: var(--btn-display, inline-block);
  width: var(--btn-width, auto);
  font-family: var(--f-body); font-size: var(--btn-size, 15px); font-weight: 600;
  line-height: 1.2;
  padding: var(--btn-pad, 12px 20px);
  border: 1px solid transparent;
  border-radius: var(--btn-radius, 999px);
  background: var(--btn-fill, var(--accent));
  color: var(--btn-fg, var(--fg-on-accent));
  cursor: pointer;
  transition: filter .16s, opacity .16s, transform .08s;
}
.btn:hover { filter: brightness(1.06) }
.btn:active { transform: translateY(1px) }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.btn:disabled { opacity: .45; cursor: default; transform: none; filter: none }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--btn-ghost-border, var(--line-2)) }
.btn.ghost:hover { background: var(--icon-wash, transparent); filter: none }
.btnrow { display: flex; gap: 9px; flex-wrap: wrap }

/* ---------------------------------------------------------------- field ---- */
.fld {
  width: 100%; box-sizing: border-box;
  font: inherit;
  font-size: 16px;            /* below 16px iOS zooms the page on focus */
  padding: 11px 13px;
  border-radius: var(--fld-radius, 10px);
  border: 1px solid var(--line-2);
  background: var(--bg-raise); color: var(--fg);
  margin: 0 0 10px;
}
.fld::placeholder { color: var(--fg-3) }
.fld:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent }
.fld.code {
  font-family: var(--f-mono); font-size: 23px; letter-spacing: .34em;
  text-align: center; padding: 12px 13px;
}

/* ------------------------------------------------------------- settings ----
   <div class="setrow">
     <div class="col"><span class="setlabel">Thing</span>
       <p class="sethint">What it does.</p></div>
     <button class="toggle" aria-pressed="false"></button>
   </div>
   -------------------------------------------------------------------------- */
.setrow {
  display: flex; align-items: center; gap: 14px;
  padding: 15px 0;
  border-bottom: 1px solid var(--line);
}
.setrow:last-of-type { border-bottom: 0 }
.setrow .col { flex: 1; min-width: 0 }
.setlabel {
  display: block; color: var(--fg);
  font-family: var(--setlabel-font, var(--f-body));
  font-size: var(--setlabel-size, 15px);
  font-weight: var(--setlabel-weight, 500);
  letter-spacing: var(--setlabel-tracking, normal);
  text-transform: var(--setlabel-case, none);
}
.sethint { margin: 3px 0 0; font-size: 13px; line-height: 1.5; color: var(--fg-3); max-width: 52ch }

.toggle {
  width: 51px; height: 30px; flex: none;
  border: none; border-radius: 999px; cursor: pointer;
  background: var(--bg-sink);
  position: relative; transition: background .22s;
}
.toggle::after {
  content: ""; position: absolute; top: 3px; left: 3px;
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--bg-raise); box-shadow: 0 1px 3px rgba(0,0,0,.28);
  transition: transform .22s;
}
.toggle[aria-pressed="true"] { background: var(--accent) }
.toggle[aria-pressed="true"]::after { transform: translateX(21px) }
.toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

.donebtn {
  background: none; border: none; cursor: pointer;
  font-family: var(--f-mono); font-size: 12.5px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--accent); padding: 6px 2px;
}
.donebtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

/* ------------------------------------------------------------------ seg ----
   A segmented control. Buttons carry aria-pressed and whatever data attribute
   the caller switches on:

     <div class="seg" id="themeSeg" role="group" aria-label="Theme">
       <button type="button" data-theme="light"  aria-pressed="false">Light</button>
       ...

   This is the iOS-style track both Word Chain and the shell had converged on.
   Sojourner's outlined-buttons version is gone; one control, one look.
   -------------------------------------------------------------------------- */
.seg {
  display: flex; gap: 3px; padding: 3px;
  background: var(--seg-track, var(--bg-sink));
  border-radius: var(--seg-radius, 999px);
}
.seg button {
  flex: 1; font: inherit; font-size: 13.5px; font-weight: 600;
  padding: 9px 10px; border: none; cursor: pointer;
  border-radius: calc(var(--seg-radius, 999px) - 3px);
  background: transparent; color: var(--fg-2);
  transition: background .18s, color .18s;
}
.seg button[aria-pressed="true"] {
  background: var(--seg-on, var(--bg-raise));
  color: var(--fg);
  box-shadow: 0 1px 2px rgba(0,0,0,.12);
}
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px }
.seg.grid { display: grid; grid-template-columns: repeat(3, 1fr) }

/* ------------------------------------------------------ the first minute ----
   A slow breath of colour on the profile button, so a first-time visitor
   notices there is an account behind it at all. It is a FADE, not a bounce or
   a badge: the button has to be noticed without becoming the loudest thing on
   a page whose whole point is the puzzle.

   Colour only -- no scale, no shadow, no movement. Animating the glyph's size
   would make the whole bar appear to twitch, and a dot badge would promise a
   notification that does not exist.

   3.2s per cycle, which is slow enough to read as breathing rather than
   blinking; anything under about two seconds starts to feel like an error
   state. It stops on its own; see ui.js for when and why. */
/* Hollow to solid and back: the outline fills IN rather than merely changing
   colour, which is a much stronger signal at 21px than a tint is.

   It works on this glyph because of what the two shapes are. The head is a
   circle, so it fills to a disc. The shoulders are an OPEN arc, and filling an
   open path closes it across the chord -- here a horizontal line between the
   two ends -- so it fills to a half-disc. Together that is exactly the solid
   person icon, which is why no second piece of artwork is needed.

   fill and stroke are animated together, so the solid state is one flat blue
   shape rather than a blue fill wearing a grey outline. Nothing moves: no
   scale, no shadow, no badge. A size change would make the whole bar appear to
   twitch, and a dot would promise a notification that does not exist.

   3.2s per cycle -- slow enough to read as breathing. Under about two seconds
   it starts to look like an error state. It stops on its own; ui.js says when
   and why. */
@keyframes ps-attn {
  0%, 100% { fill: transparent;       stroke: var(--icon-fg, var(--fg-2)) }
  50%      { fill: var(--attn);       stroke: var(--attn) }
}
/* The children, not the button: fill="none" is a presentation attribute on the
   <svg>, and a CSS declaration on the shapes themselves outranks it. */
.iconbtn.attn svg > * { animation: ps-attn 3.2s ease-in-out infinite }

/* Reduced motion does not mean "no emphasis" -- someone who turns it on still
   has to find the button. It means no ANIMATION, so the icon simply rests
   solid, which carries the same message without the pulse. */
@media (prefers-reduced-motion: reduce) {
  .iconbtn.attn svg > * {
    animation: none;
    fill: var(--attn); stroke: var(--attn);
  }
}

/* --------------------------------------------------------------- avatar ----
   The three shapes PSUI.avatar() can return, plus the round frame they sit in.
   Sized by whatever contains them, never by themselves, so one renderer serves
   a 26px bar button and a 64px profile disc. */
.psav {
  border-radius: 50%; overflow: hidden; flex: none;
  display: grid; place-items: center;
  background: var(--bg-sink); color: var(--fg);
}
.psav-img { width: 100%; height: 100%; display: block; object-fit: cover }
.psav-svg { width: 100%; height: 100%; display: block }
.psav-ltr {
  font-family: var(--f-disp); font-weight: 900;
  font-size: .52em;            /* of the frame, so it scales with the disc */
  line-height: 1; user-select: none;
}
/* Wearing a face, the button holds a filled disc rather than a 21px outline.
   30px inside a 38px button: a solid shape reads heavier than a stroked one at
   the same size, so matching the icons' optical weight means going smaller
   than the button, not filling it. */
.iconbtn.has-av > * { width: 30px; height: 30px; display: block; border-radius: 50% }
.iconbtn.has-av .psav-ltr {
  display: grid; place-items: center; background: var(--bg-sink);
  color: var(--fg); font-family: var(--f-disp); font-weight: 900; font-size: 15px;
}

/* -------------------------------------------------------- sign-in card ----
   Used by the front door's Profile sheet and by the sign-in gate on every
   surface. Lifted here from the shell once the gate needed it inside the games:
   one card, one set of rules, however someone arrived at it. */
/* The eyebrow that used to sit in a sheet's top-right corner, before the
   corner became Close. Same mono voice it had there, now a line of its own
   directly under the heading. */
.sh-status{
  font-family:var(--f-mono); font-size:10.5px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--fg-3); margin:-12px 0 16px;
}

/* ---------- profile: the signed-out card ----------------------------------
   Modelled on the reference: one instruction, the address and its button on
   one line, a labelled rule, the provider row at the same size as the field,
   a second rule, and the legal line. Nothing else -- every extra control here
   is a reason not to sign in. */
.pf-lead{font-size:14.5px; line-height:1.6; color:var(--fg-2); margin:0 0 16px; max-width:46ch}
.pf-mailrow{display:flex; gap:8px; align-items:center}
.pf-mailrow .fld{margin:0; flex:1 1 auto; min-width:0}
.pf-mailrow .btn{flex:none; white-space:nowrap; --btn-radius:10px; --btn-pad:12px 16px;
  /* The button is as wide as its words, whatever the surface's default. Sojourner
     sets every button to full width (--btn-width:100%), which is right on its
     landing page and wrong here: in this row the button took all 518px, the
     address field shrank to 28px, and the button ran off the card's edge -- the
     horizontal scroll on a phone. Both the dial and the property, so neither a
     dial nor a plain width rule from a game can win. */
  --btn-width:auto; width:auto}
/* Below this the field and the button together are narrower than the words in
   the button, so the row stacks rather than squeezing the address to nothing. */
@media (max-width:429px){
  .pf-mailrow{flex-wrap:wrap}
  .pf-mailrow .btn{width:100%}
}

/* ---- OR ---- : the rule is two flex children of the row, so it cannot
   overlap the word no matter how wide the sheet gets. */
.pf-rule{
  display:flex; align-items:center; gap:14px; margin:22px 0;
  font-family:var(--f-mono); font-size:10.5px; letter-spacing:.2em;
  text-transform:uppercase; color:var(--fg-3);
}
.pf-rule::before,.pf-rule::after{content:""; flex:1; height:1px; background:var(--line-2)}
.pf-rule.bare{gap:0}

/* The whole line is the button, per the brief: the words, the logo and the
   provider name are one target, sized like the field above it. */
.oauth{
  display:flex; align-items:center; justify-content:center; gap:10px;
  width:100%; box-sizing:border-box; cursor:pointer;
  font:inherit; font-size:15px; font-weight:600;
  padding:11px 13px; border-radius:10px;
  border:1px solid var(--line-2); background:var(--bg-raise); color:var(--fg);
  transition:background .16s, border-color .16s;
}
.oauth:hover{background:var(--bg-sink); border-color:var(--fg-3)}
.oauth:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.oauth svg{width:18px; height:18px; flex:none}
.oauth .lead{
  font-family:var(--f-mono); font-size:10.5px; font-weight:400; letter-spacing:.18em;
  text-transform:uppercase; color:var(--fg-2);
}
.pf-legal{font-size:12.5px; line-height:1.65; color:var(--fg-3); text-align:center; margin:0}
.pf-legal a{color:var(--fg-2); text-decoration-color:var(--accent); text-underline-offset:2px}


/* A code, on the upgrade card. Set apart by a rule, because it is a second way
   in rather than a detail of the first. */
.promo{margin:18px 0 0; padding-top:16px; border-top:1px solid var(--line)}
.promo .setlabel{display:block; margin:0 0 8px}
.promo .fld{text-transform:uppercase; letter-spacing:.06em}
.promo .fld::placeholder{text-transform:none; letter-spacing:0}

/* ------------------------------------------------- friend challenges ----- */
/* The count of games waiting on you, on the 1v1 button. Hidden at zero rather
   than shown as "0": a badge saying nothing is waiting is a notification about
   the absence of notifications. */
.btn.chal{position:relative; overflow:visible}
.turnbadge{
  position:absolute; top:-7px; right:-7px; min-width:22px; height:22px;
  display:grid; place-items:center; padding:0 6px; box-sizing:border-box;
  border-radius:999px; background:var(--accent); color:var(--fg-on-accent);
  font-family:var(--f-mono); font-size:11px; font-weight:600; line-height:1;
  box-shadow:0 0 0 2px var(--bg);
}
.chal-list{margin:0 0 16px}
.chal-list:empty::after{
  content:"Nothing here yet. A challenge a friend sends you will be waiting here.";
  display:block; padding:18px; border-radius:11px; text-align:center;
  border:1px dashed var(--line-2); color:var(--fg-3); font-size:13.5px; line-height:1.6;
}

/* ------------------------------------------------------------ the gate ----- */
.gate-msg{
  margin:0 0 18px; padding:12px 14px; border-radius:11px;
  background:color-mix(in srgb, var(--accent) 9%, transparent);
  color:var(--fg); font-size:14.5px; line-height:1.55;
}

/* ----------------------------------------------------------- analytics ----- */
.an-scope{margin:0 0 20px}
.an-scope .seg{margin:0 0 10px}
.an-scope select.fld{margin:0 0 6px}
.an-none{margin:2px 0 8px; font-size:13.5px; color:var(--fg-3); font-style:italic}
.an-how{margin:0; font-size:13px; line-height:1.6; color:var(--fg-2)}
.an-how .inlink{
  font:inherit; color:var(--fg); background:none; border:0; padding:0; cursor:pointer;
  display:inline-flex; align-items:center; gap:4px; vertical-align:baseline;
  text-decoration:underline; text-decoration-color:var(--accent); text-underline-offset:2px;
}
.an-how .inlink svg{flex:none; position:relative; top:1px}
.an-block{padding:14px 0 0; border-top:1px solid var(--line)}
.an-block h3{
  margin:0 0 8px; font-family:var(--f-mono); font-size:10.5px; font-weight:500;
  letter-spacing:.18em; text-transform:uppercase; color:var(--fg-2);
}
/* The empty area, drawn as a place-holder rather than left as nothing, so the
   three horizons read as three things even before they hold numbers. */
.an-body{min-height:64px; margin:0 0 16px; border-radius:11px;
  border:1px dashed var(--line-2); background:color-mix(in srgb, var(--fg) 3%, transparent)}
.an-block.locked h3{opacity:.5}
.an-block.locked .an-body{display:none}
.an-lock{margin:2px 0 4px; padding:16px; border-radius:12px; text-align:center;
  border:1px solid var(--line-2); background:var(--bg-sink)}
.an-lock p{margin:0 0 12px; font-size:14px; color:var(--fg)}

/* -------------------------------------------------------------- utility ---- */
/* Present to a screen reader, absent to everything else. Used where a control
   is obvious by position but has no visible label -- clip-path rather than
   display:none, which would take it out of the accessibility tree too. */
.ui-sr {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
}
.ui-note {
  margin: 10px 0 0; padding: 10px 12px; border-radius: 9px;
  font-size: 13px; line-height: 1.5;
  background: var(--bg-sink); color: var(--fg);
}
.ui-note.bad { background: color-mix(in srgb, var(--warn) 16%, transparent) }
.empty {
  text-align: center; padding: 26px 10px; margin: 0 auto;
  font-size: 14px; line-height: 1.6; color: var(--fg-2); max-width: 40ch;
}

/* Both games already zeroed every transition under reduced motion; the shell
   only covered three selectors. One blanket rule, so a new game cannot forget. */
@media (prefers-reduced-motion: reduce) {
  .sheet, .scrim, .toast, .iconbtn, .btn, .toggle, .toggle::after, .seg button {
    transition-duration: .01ms !important;
  }
}

/* ---------------------------------------------------------------- the bar ---
   The platform bar, shared by the shell and every game. Markup lives in
   packages/ui/bar.html; this is only how it looks.

   Fixed, and above every sheet trigger but below the sheets themselves, so a
   dialog still covers it. Nothing may overlap it: content scrolls UNDER, which
   is what .psbar-pad is for -- put it on the scrolling container and the first
   line always clears the bar, including the phone's safe-area inset.
   -------------------------------------------------------------------------- */
.psbar{
  position:fixed; top:0; left:0; right:0; z-index:40;
  display:flex; align-items:center; gap:11px;
  min-height:calc(var(--bar-h,54px) + env(safe-area-inset-top, 0px));
  padding:calc(env(safe-area-inset-top, 0px) + 9px) 14px 9px;
  background:var(--bg);
  border-bottom:1px solid var(--line);
}
/* Anything that scrolls under the bar carries this. */
.psbar-pad{ padding-top:calc(var(--bar-h,54px) + env(safe-area-inset-top, 0px)) }

.psbar-brand{
  display:flex; align-items:center; gap:9px; min-width:0;
  color:var(--fg); text-decoration:none; border-radius:10px;
}
.psbar-brand:focus-visible{ outline:2px solid var(--accent); outline-offset:3px }
.psbar-mark{ width:44px; flex:none; display:block; --mk-w:62 }
/* Set exactly as the landing page sets it: Fraunces, 600 with SAPIEN at 900. */
.psbar-name{
  font-family:var(--f-disp); font-weight:600; font-size:17.5px;
  letter-spacing:-.014em; white-space:nowrap; color:var(--fg);
}
.psbar-name b{ font-weight:900 }
.psbar-gap{ flex:1 }
.psbar-nav{ display:flex; align-items:center; gap:2px; flex:none }

@media (max-width:420px){
  .psbar{ gap:6px; padding-left:10px; padding-right:6px }
  .psbar-mark{ width:34px }
  .psbar-brand{ gap:7px }
  .psbar-name{ font-size:15px }
  .psbar-nav{ gap:0 }
  /* Six icons and the wordmark on a phone: each button gives up a few pixels
     (38 -> 34, the glyph stays the same size) so the row never meets the name. */
  .psbar .iconbtn{ --icon-btn:34px }
  .psbar .iconbtn.has-av > *{ width:28px; height:28px }
}
@media (max-width:374px){
  .psbar .iconbtn{ --icon-btn:32px }
}
/* Below this the wordmark would push the icons off the edge; the mark alone
   still identifies the platform and still goes home. */
@media (max-width:359px){ .psbar-name{ display:none } }

/* ------------------------------------------------- the daily-game row ---- */
/* TODAY, then the days before it, in a row that scrolls sideways. Each button
   is a little under a third of the row, so the edge of a fourth shows and
   says "there is more this way". The 2px padding (taken back by the margin)
   keeps a keyboard focus ring from being clipped by the scroller.
   Specificity is three classes on purpose: each game sizes its own .btn with
   two (".playset .btn"), and this has to win in both. */
.dayrow{display:flex; gap:8px; overflow-x:auto; overscroll-behavior-x:contain;
  scroll-snap-type:x proximity; scrollbar-width:none; padding:2px; margin:-2px}
.dayrow::-webkit-scrollbar{display:none}
.dayrow .btn.dayb{flex:0 0 calc((100% - 16px) / 3.2); width:auto; min-width:0;
  scroll-snap-align:start; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:3px; padding:11px 4px; line-height:1.1}
.dayrow .btn.dayb .dayn{font-size:17px; font-weight:700; letter-spacing:.04em;
  font-variant-numeric:tabular-nums}
.dayrow .btn.dayb small{display:block; font-family:var(--f-mono); font-size:11px;
  font-weight:400; letter-spacing:.02em; text-transform:none; opacity:.75}

/* ------------------------------------------------------ who is here ----
   The strip at the top-left of Analytics, Friends, Settings and Profile:
   face, name over email, a hairline, then the card's title; Close stays top
   right; a hairline under the whole row. The face, the two lines of text and
   the hairline are all 30px tall -- the height the 23px title occupies -- so
   the row reads as one line of type. ui.js fills [data-ps-who]. The text is
   the part that gives way on a narrow phone (ellipsis), never the title. */
.sh-head.ps-head{align-items:center; gap:10px; padding-bottom:14px; margin-bottom:18px;
  border-bottom:1px solid var(--line)}
.ps-head h2{line-height:30px; white-space:nowrap; flex:none}
.ps-head .donebtn{flex:none}
.ps-head + .sh-status{margin-top:0}
.ps-who{display:flex; align-items:center; gap:10px; min-width:0; flex:0 1 auto}
.ps-who:empty{display:none}
.ps-who-av{width:30px; height:30px; font-size:30px}
.ps-who-av.anon svg{width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:1.7;
  stroke-linecap:round; stroke-linejoin:round; opacity:.75}
.ps-who-tx{display:flex; flex-direction:column; justify-content:center; height:30px;
  min-width:0; max-width:200px; line-height:1.18}
.ps-who-tx b, .ps-who-tx span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ps-who-tx b{font-size:13px; font-weight:600; color:var(--fg)}
.ps-who-tx span{font-size:11px; color:var(--fg-3)}
.ps-who-rule{width:1px; height:30px; background:var(--line-2); flex:none}

/* --------------------------------------------------------- profile ----
   The Profile card, shared by every surface (bar.html). Section rules, the
   subtitle (.pf-sub) and the sub-subtitle (.setlabel) are set here rather
   than borrowed from a surface, so the card looks like itself everywhere and
   takes only its colours from the game it is opened in. */
.pfsec{padding:0 0 20px; margin:0 0 20px; border-bottom:1px solid var(--line)}
.pfsec:last-of-type{border-bottom:0; padding-bottom:4px; margin-bottom:0}
.pf-sub{font-family:var(--f-disp); font-weight:700; font-size:15.5px; line-height:1.25;
  letter-spacing:-.006em; color:var(--fg); margin:0 0 12px}
#pfIn .setlabel{margin:0 0 8px}

/* "Sapien since ..." on the left, the one button that changes it on the right.
   On a phone too narrow for both, the button drops to its own line and keeps
   to the right; the status never drifts toward the middle. */
.pf-planrow{display:flex; align-items:center; justify-content:flex-start; flex-wrap:wrap;
  gap:10px 16px; margin:0 0 12px}
.pf-planbtn{margin-left:auto}
.pf-since{font-size:14.5px; color:var(--fg)}
.pf-planbtn .btn{--btn-width:auto; width:auto; white-space:nowrap; --btn-pad:10px 18px; --btn-size:14px}
/* Reserved height: the two plans' words differ in length, and the hover swap
   must not make the card jump under the pointer. */
.planwhy{font-size:14px; line-height:1.62; color:var(--fg-2); margin:0; min-height:4.86em}
.planwhy b{color:var(--fg)}
.planwhy.peek{color:var(--fg-3); font-style:italic}

/* The three avatar categories: a picture over its name. */
.avcats{display:flex; gap:16px; flex-wrap:wrap; margin:4px 0 20px}
.avcat{display:flex; flex-direction:column; align-items:center; gap:7px; width:92px}
.avcat-pic{position:relative; width:92px; height:92px; padding:0; border:0; border-radius:50%;
  background:none; cursor:pointer; color:inherit; display:block}
.avcat-pic:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
.avcat-pic .psav{width:100%; height:100%; font-size:92px; transition:opacity .15s}
.avcat.on .avcat-pic .psav{box-shadow:0 0 0 3px var(--sheet-bg, var(--bg-raise)), 0 0 0 7px var(--accent),
  0 0 22px 9px color-mix(in srgb, var(--accent) 50%, transparent)}
.avcat-name{font-size:12.5px; color:var(--fg-2); text-align:center}
.avcat.on .avcat-name{color:var(--fg); font-weight:600}
.avcat-pic.add .psav{background:transparent; border:2px dashed var(--line-2); box-sizing:border-box;
  color:var(--fg-3)}
.avcat-pic.add:hover .psav{color:var(--fg); border-color:var(--fg-3)}
.avcat-pic.add svg{width:44px; height:44px; fill:none; stroke:currentColor; stroke-width:1.6;
  stroke-linecap:round}
/* Your Image, once there is one: hover (or a tap, which focuses it) fades the
   picture and offers three pills. */
.avcat-ops{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:4px; opacity:0; pointer-events:none; transition:opacity .15s}
.avcat-ops button{font-family:var(--f-body); font-size:10px; font-weight:700; letter-spacing:.08em;
  line-height:1; padding:5px 0; width:68px; border-radius:99px; cursor:pointer;
  border:1px solid var(--line-2); background:var(--bg-raise); color:var(--fg)}
.avcat-ops button:hover, .avcat-ops button:focus-visible{background:var(--fg); color:var(--bg-raise);
  border-color:var(--fg); outline:none}
@media (hover:hover){
  .avcat-img:hover .avcat-ops{opacity:1; pointer-events:auto}
  .avcat-img:hover .psav{opacity:.16}
}
.avcat-img:focus-within .avcat-ops{opacity:1; pointer-events:auto}
.avcat-img:focus-within .psav{opacity:.16}

/* Every face in a category (the picker, over the Profile card). */
.avgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(56px,1fr)); gap:12px; margin:0 0 6px}
.avgrid.big{grid-template-columns:repeat(auto-fill,minmax(74px,1fr))}
.avgrid button{padding:0; background:none; cursor:pointer; aspect-ratio:1;
  border:2px solid transparent; border-radius:50%}
.avgrid .psav{width:100%; height:100%; font-size:46px}
.avgrid button[aria-pressed="true"]{border:3px solid var(--accent);
  box-shadow:0 0 16px 5px color-mix(in srgb, var(--accent) 50%, transparent)}
.avgrid button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* Signed-in devices: the same row shape as a friends list. */
.devlist{margin:2px 0 0}
.devlist .sethint{margin:10px 0 0}
.devrow{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line)}
.devrow:last-child{border-bottom:0}
.devrow .ic{width:34px; height:34px; border-radius:9px; flex:none; display:grid; place-items:center;
  background:var(--bg-sink); color:var(--fg-2)}
.devrow .ic svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.7;
  stroke-linecap:round; stroke-linejoin:round}
.devrow .dn{flex:1; min-width:0; font-size:14.5px; color:var(--fg)}
.devrow .dn em{display:block; font-style:normal; font-size:12.5px; color:var(--fg-2)}
.devrow .dn .here{display:inline-block; margin-left:7px; padding:1px 7px; border-radius:99px;
  font-size:11px; font-weight:600; letter-spacing:.02em; vertical-align:2px;
  color:var(--accent); background:color-mix(in srgb, var(--accent) 13%, transparent)}
.devrow .btn{flex:none; white-space:nowrap; --btn-width:auto; width:auto;
  --btn-pad:7px 12px; --btn-size:13px; --btn-radius:9px}
#pfIn .btnrow .btn, #delSheet .btnrow .btn, #downSheet .btnrow .btn, #nameSheet .btnrow .btn{--btn-width:auto; width:auto}
#nameSheet .fld{width:100%; margin:6px 0 12px}
#nameSheet .hint{margin:0 0 14px}

/* The one button that destroys something: a ghost in the warning colour. */
.btn.ghost.danger{color:var(--warn); border-color:color-mix(in srgb, var(--warn) 40%, transparent)}
.btn.ghost.danger:hover{background:color-mix(in srgb, var(--warn) 10%, transparent)}

/* A name someone else already has: said in red, directly under the field. */
:root{--err:#C62828}
:root[data-theme="dark"]{--err:#FF8A80}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--err:#FF8A80} }
.pf-err{color:var(--err); font-size:13.5px; font-weight:600; margin:-4px 0 12px}

/* The free trial, on the upgrade card. */
.trialbox{padding:14px 16px; margin:4px 0 16px; border-radius:12px;
  border:1px solid var(--line-2); background:var(--bg-sink)}
.trialbox p{margin:0 0 12px}
.trialbox .btn{--btn-width:auto; width:auto}

/* ------------------------------------------------------- page edges ----
   Nothing may make a page wider than the phone. A single decoration that
   bleeds a few pixels past the edge is enough for iOS Safari to let the whole
   page pan sideways -- which also makes the fixed top bar appear to slide. So
   the page clips anything horizontal at its own edge ("clip", not "hidden":
   it does not turn the page into a scroll box), and a page that fits does
   not rubber-band when it is dragged. */
html, body{ overflow-x:clip; max-width:100% }
@supports not (overflow-x:clip){ body{ overflow-x:hidden } }
html, body{ overscroll-behavior-y:none }

/* --------------------------------------------------------- friends ----
   The shared Friends card (bar.html #friendsSheet). */
.frcode{display:flex; align-items:center; gap:12px; margin:16px 0 4px; padding:12px 14px;
  border:1px dashed var(--line-2); border-radius:11px}
.frcode .col{flex:1; min-width:0}
.frcode code{display:block; margin-top:2px; font-family:var(--f-mono); font-size:18px;
  letter-spacing:.2em; color:var(--fg)}
.frcode .btn{flex:none; --btn-width:auto; width:auto; --btn-pad:8px 12px; --btn-size:13px; --btn-radius:9px}
.frsec{margin:22px 0 0}
.frsec > h3{display:flex; align-items:baseline; gap:8px}
.frsec > h3 small{font-family:var(--f-mono); font-size:11px; font-weight:400; letter-spacing:.06em;
  color:var(--fg-3)}
.frrow{display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; padding:11px 0;
  border-bottom:1px solid var(--line)}
.frrow:last-child{border-bottom:0}
.frrow > .psav{width:34px; height:34px; font-size:34px}
.frrow .fn{flex:1; min-width:0; font-size:14.5px; color:var(--fg); overflow-wrap:anywhere}
.frrow .fn em{display:block; font-style:normal; font-size:12.5px; color:var(--fg-2)}
.frrow .acts{display:flex; flex-wrap:wrap; gap:6px; margin-left:auto}
.frrow.wide .acts{flex-basis:100%; margin-left:46px}
.frrow .btn{flex:none; white-space:nowrap; --btn-width:auto; width:auto;
  --btn-pad:6px 11px; --btn-size:12.5px; --btn-radius:9px}
.frsec .sethint{margin:4px 0 6px}
.frblocked summary{cursor:pointer; font-size:13.5px; color:var(--fg-2); padding:6px 0}
.frpaused{margin:14px 0 0}
/* ===== END packages/ui/ui.css ===== */

/* ===========================================================================
   WORD CHAIN — the local layer, on top of the shared tokens and the shared UI.

   Three things live here and nothing else:

     1. The DIALS. packages/ui/ui.css above owns the ANATOMY of every platform
        control — sheet, scrim, toast, corner bar, button, field, settings row,
        toggle, segmented control. What it deliberately does not own is
        character, and character is set by turning its component tokens here.
        Word Chain's ink pill buttons and its rounded-rect seg track are the
        shared `.btn` and `.seg` with the dials turned, not a second copy.

     2. Word Chain's OWN ramp — --clay*, --key*, --tile*. Local, never shared,
        and used by surfaces the platform has no component for: the home
        ground, the keycaps, the results tile.

     3. Word Chain's OWN components: the bar, the board, the keyboard, the
        composer, the pause and results cards. Nothing platform-shaped.

   ui.css is inlined ABOVE this block, so a rule here at equal specificity
   wins. Every such override carries a comment saying why it is character and
   not drift. If a rule here has no such comment, it should not be here.
   =========================================================================== */
.wc-game {
  /* ---- dials into packages/ui/ui.css -----------------------------------
     --sheet-bg, --seg-track and --seg-on were the local --sheet, --segtrack
     and --segon: the same values, now feeding the shared components instead
     of duplicating them.
     --btn-radius is NOT set — 999px is already the shared default, and a pill
     is what this game wanted.
     --icon-btn, --icon-stroke, --corner-gap, --sheet-radius and --sheet-ease
     are set platform-wide in tokens.css's :root and are right as they are.
     --toast-bottom (26px) and --toast-z are the shared defaults; the local
     toast's 2.6s and z-index 50 were drift, not character. */
  --sheet-bg:var(--bg-raise);  /* sheets, the pause card, the results card    */
  --seg-track:var(--bg-sink);  /* a segmented control's track is a well       */
  --seg-radius:11px;           /* character: WC's seg is a panel control, a
                                  rounded rect rather than a pill. The shared
                                  file derives the button radius as
                                  calc(track - 3px) = 8px, which is exactly
                                  the radius this game already drew.          */
  --btn-size:16px;             /* character: a big, confident home button     */
  --btn-pad:15px 30px;
  --btn-fill:var(--fg);        /* THE INK PILL. Sojourner's button is an amber
                                  block, the shell's is steel; Word Chain's is
                                  the text colour itself, reversed out.       */
  --btn-fg:var(--bg);
  --icon-wash:var(--bg-raise); /* the top bar's icon buttons wash to the
                                  raised ground (the corner bar differs — see
                                  the home screen below)                      */

  /* ---- Word Chain's own ramp, the parts that are the same in both themes -- */
  --key:var(--bg-sink);      /* a keycap is a sunk ground — tokens.css says so */
  --tilebg:var(--accent);    /* the signature block on the results card        */
  --tilefg:var(--fg-on-accent);

  --vh:100dvh;
}

/* local ramp — light. Mirrors the three-block order of tokens.css exactly:
   light base, explicit dark, then system-following dark. */
.wc-game {
  /* --clay is the home screen's full-bleed ground and the game's signature
     wash. Light enough that --accent (the hinted letters in #homeSolution)
     still clears 4.5:1 on it; see the note in the report. */
  --clay:#EFCBDA; --clay-deep:#D9A3B9; --clay-soft:#F7E3EB;
  --key-press:#C6A5B3;
  --seg-on:#FBF2F6;          /* the selected pill lifts out of the track        */
}
.wc-game[data-theme="dark"], .wc-game.t-dark {
  --clay:var(--bg-raise); --clay-deep:var(--bg); --clay-soft:#574349;
  --key-press:#574349;
  --seg-on:#5C4A52;
}
@media (prefers-color-scheme:dark) {
  .wc-game:not([data-theme="light"]) {
    --clay:var(--bg-raise); --clay-deep:var(--bg); --clay-soft:#574349;
    --key-press:#574349;
    --seg-on:#5C4A52;
  }
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%; overflow:hidden}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:var(--f-body); font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
}
#app{
  position:fixed; top:0; left:0; right:0; height:var(--vh);
  display:flex; flex-direction:column; overflow:hidden;
}

/* ======================= HOME ======================= */
#home{
  position:fixed; top:0; left:0; right:0; height:var(--vh); z-index:20; background:var(--clay);
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  /* The top padding clears the fixed bar (it lives inside #home), so the chain
     icon and the title can never slide under it, however short the window. */
  padding:calc(env(safe-area-inset-top) + var(--bar-h) + 14px) 22px calc(env(safe-area-inset-bottom) + 18px);
  text-align:center; overflow-y:auto; overscroll-behavior:none;
}
/* Centred when there is room, top-aligned when there is not: auto margins on
   the first and last blocks do what justify-content:center does, without
   pushing the top of the content above the scrollable area on a short screen. */
#home > .brand-mark{ margin-top:auto }
#home > .home-foot{ margin-bottom:auto }
/* ui.css owns .corner's anatomy (a flex row at --corner-gap). Where it sits is
   this game's business, and ui.css says so: on the home screen it floats in the
   top-right safe area. */
.corner{position:absolute; top:calc(env(safe-area-inset-top) + 8px); right:10px; z-index:2}
/* character: the corner controls and the way out sit on --clay, the home
   screen's own ground, not on --bg. So they take the primary ink at 72% and a
   neutral ink/paper wash, rather than the bar's --bg-raise. These are the
   shared icon-bar dials, scoped to the two controls that need them — the wash
   is a WC surface colour and must not leak to .btn.ghost. */
.corner, .platform-link{--icon-fg:var(--fg); --icon-fg-on:var(--fg); --icon-wash:rgba(51,38,44,.09)}
:root[data-theme="dark"] .corner,
:root[data-theme="dark"] .platform-link{--icon-wash:rgba(242,230,235,.09)}
/* Not in the audit, found while doing S7: the dark wash above was scoped to the
   EXPLICIT dark choice only, so a player on theme "system" with a dark OS — the
   one path where [data-theme] is absent — got the light wash (a dark ink scrim)
   on a dark ground. Same rule, same value, under the media query. */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .corner,
  :root:not([data-theme="light"]) .platform-link{--icon-wash:rgba(242,230,235,.09)}
}
.corner .iconbtn{opacity:.72}
.corner .iconbtn:hover,.corner .iconbtn:focus-visible{opacity:1}
.brand-mark{color:var(--fg); margin-bottom:14px}
.brand-mark svg{display:block}

/* Audit S7: neither game offered a way back to the platform — #homeBtn goes to
   THIS game's home screen, not to PlaySapien. This is that way out. It mirrors
   .corner on the opposite top edge, and lives on the home screen because that is
   the only screen with a corner bar; during play the bar is #bar and leaving
   mid-round is what the pause dialog is for.
   Quiet on purpose: it is an exit, not a call to action. It is a link, not an
   .iconbtn — it carries a label — so it is not part of the shared icon bar. */
.platform-link{
  position:absolute; top:calc(env(safe-area-inset-top) + 8px); left:10px; z-index:2;
  display:flex; align-items:center; gap:5px; height:38px; padding:0 10px;
  border-radius:999px; text-decoration:none;
  font-family:var(--f-body); font-size:12.5px; font-weight:600;
  letter-spacing:.02em; color:var(--fg); opacity:.52;
  transition:opacity .16s, background .16s;
}
.platform-link svg{display:block; flex:none}
.platform-link:hover{opacity:1; background:var(--icon-wash)}
.platform-link:focus-visible{outline:2px solid var(--accent); outline-offset:1px; opacity:1}
@media (max-width:359px){ .platform-link .plabel{display:none} }
#home h1{
  font-family:var(--f-disp); font-weight:900; font-size:clamp(42px,13vw,60px);
  letter-spacing:-.022em; margin:0 0 6px; line-height:1; color:var(--fg);
}
.tagline{
  font-family:var(--f-disp); font-weight:400; font-size:clamp(19px,5.2vw,24px);
  line-height:1.28; margin:0 0 32px; max-width:16ch; color:var(--fg); text-wrap:balance;
}
.homebtns{display:flex; flex-direction:column; gap:11px; width:min(320px,100%)}
/* The buttons themselves are ui.css's .btn, dialled to ink pills at the top of
   this file. What is left below is what the shared layer has no dial for. */
/* character: Word Chain's ghost button is a FULL-INK outline that pairs with the
   filled ink pill beside it — the two read as one control in two states. The
   shared default is a muted --line-2 hairline, which is right for a surface
   whose buttons are accent-filled but disappears next to an ink pill.
   There is no --btn-ghost-border dial. */
.btn.ghost{border-color:var(--fg)}
/* greyed but still live: a button that refuses a press should be able to say why.
   Distinct from :disabled, which the shared layer already dims to .45. */
.btn.off{opacity:.4}
.iconbtn.off{opacity:.32}
/* the composer's Save sits in a toolbar, not under a heading, so it is smaller
   than a home button. Same anatomy, tighter. */
.btn.small{padding:9px 20px; font-size:14px; flex:none}
.home-foot{
  margin-top:26px; font-family:var(--f-disp); font-size:14.5px; line-height:1.6; color:var(--fg);
}
.home-foot .d1{font-weight:600}
.home-foot .d2{opacity:.72}
#homeSolution{
  margin-top:14px; padding-top:13px; border-top:1px solid rgba(51,38,44,.22);
  display:flex; flex-wrap:wrap; justify-content:center; gap:0 9px;
  max-width:320px; margin-left:auto; margin-right:auto;
}
:root[data-theme="dark"] #homeSolution{border-top-color:rgba(242,230,235,.16)}
/* same omission as the corner wash above — see the note there */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) #homeSolution{border-top-color:rgba(242,230,235,.16)}
}
.solword{
  font-family:var(--f-disp); font-weight:600; font-size:14.5px; letter-spacing:.055em;
  color:var(--fg); display:inline-flex; white-space:nowrap;
}
/* the separator hangs off the word BEFORE it, so a wrap leaves the dot trailing at the
   end of a line rather than orphaned at the start of the next one */
.solword:not(:last-child)::after{content:"\00b7"; opacity:.4; margin-left:9px; font-weight:400}
.reschain .ch.hinted{color:var(--accent)}

/* ======================= BAR ======================= */
#bar{
  flex:none; background:var(--bg); border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;
  display:flex; align-items:center; gap:10px; min-height:56px;
}
.spacer{flex:1}
#clock{
  font-family:var(--f-mono); font-size:19px; font-variant-numeric:tabular-nums;
  color:var(--fg); flex:none;
}
#mode{
  font-family:var(--f-mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--fg-3); border:1px solid var(--line); border-radius:999px;
  padding:3px 8px; flex:none;
}
#bankwrap{
  display:flex; align-items:center; gap:5px; color:var(--accent); min-width:0; overflow:hidden;
  font-family:var(--f-mono); font-size:12.5px;
}
#bankicons{display:flex; gap:2px}
#bankicons svg{display:block}
.hintwrap{position:relative; display:flex; align-items:center; flex:none}
/* not a .btn: it is a metered action with a price on it, and its outline, its
   cost slot and its disabled state are all its own. */
.hintbtn{
  display:flex; align-items:center; gap:7px; cursor:pointer; border-radius:999px;
  border:1.5px solid var(--line-2); background:transparent; color:var(--fg);

/* ======================= BOARD ======================= */
#play{flex:1; min-height:0; display:flex; flex-direction:column; background:var(--bg)}

  flex:1; min-height:0; overflow-y:auto; padding:12px 16px 16px;
  -webkit-overflow-scrolling:touch; display:flex; flex-direction:column; justify-content:center;
}
#chain{max-width:460px; width:100%; margin:0 auto; display:flex; flex-direction:column; gap:4px; flex:none}

.row .num{
  font-family:var(--f-mono); font-size:11px; color:var(--fg-3); width:15px;
  flex:none; text-align:right; opacity:.6; margin-right:10px;
}
.word,#typed{
  font-family:var(--f-disp); font-weight:600; font-size:clamp(20px,5.6vw,26px);
  letter-spacing:.055em; line-height:1.15; display:flex; gap:.055em;
  color:var(--fg); flex:0 0 auto; flex-wrap:nowrap; white-space:nowrap;
}
.ch{display:inline-block}
.ch.hinted{color:var(--accent)}
/* a letter bought with a Lifeline stays marked for the life of the chain, not just
   while its word is the active one */
.solutionline .ch.hinted{color:var(--accent)}
.row.solved,.row.given{background:var(--bg-raise)}
.row.current{box-shadow:inset 0 0 0 2px var(--fg)}
.row.pending .word{color:var(--line-2)}
.row.pending .word .ch:first-child{color:var(--fg-3)}
.tickmark{margin-left:auto; color:var(--good); flex:none; display:flex}
.givenlab{
  margin-left:auto; font-family:var(--f-mono); font-size:9.5px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--fg-3); flex:none;
}

/* the caret and the submit arrow ride the active row */
#editwrap{display:flex; align-items:center; gap:0; flex:1 1 auto; min-width:0}
#typed.fading{opacity:0; transition:opacity .24s ease}
#typed.dim{opacity:.45}
#caret{
  width:2px; height:clamp(22px,6vw,29px); background:var(--accent); flex:none;
  margin-left:1px; animation:blink 1.1s step-end infinite;
}
#caret.off{opacity:0; animation:none}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
#go{
  flex:none; margin-left:auto; width:34px; height:34px; border-radius:9px; border:none;
  cursor:pointer; background:var(--fg); color:var(--bg);
  display:flex; align-items:center; justify-content:center; transition:opacity .16s, transform .12s;
}
#go:active{transform:scale(.94)}
#go:disabled{opacity:.35}
#msg{
  font-family:var(--f-disp); font-size:15px; line-height:1.32; color:var(--accent);
  padding:5px 12px 0 37px; min-height:20px; max-width:460px; margin:0 auto; width:100%;
  text-wrap:balance; flex:none;
}
#msg.good{color:var(--good); font-weight:600}
.thinking{display:inline-flex; gap:4px; align-items:center; height:20px}
.thinking i{width:5px; height:5px; border-radius:50%; background:var(--fg-3); display:block;
  animation:pulse 1.1s infinite ease-in-out}
.thinking i:nth-child(2){animation-delay:.16s}
.thinking i:nth-child(3){animation-delay:.32s}
@keyframes pulse{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* ======================= KEYBOARD ======================= */
/* Word Chain's own, and NOT part of the shared layer: no other surface carries a
   keyboard, and this one is sized against --vh (the visual viewport) so device

#kb{

}

   open and returns to whatever opened it on close.

    ['#5A7085', '#EDE7DC'],   /* the proof's steel foil     */
    ['#3F5569', '#C5C6C1'],
    ['#2F434C', '#9D8D85'],
    ['#8E3A5A', '#F0E0E7'],   /* Word Chain                 */

     a hint and a nag:

       - When the player is wearing an avatar. Pulsing somebody's own face at

       - After a minute. A pulse with no end stops reading as a pointer and

    b.addEventListener('click', function () { attnStop(true); }, { once: true });
    setTimeout(function () { attnStop(false); }, ATTN_MS);
