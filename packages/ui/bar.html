<!-- The platform bar. One definition, inlined verbatim into every surface by
     packages/tokens/sync-inline.mjs, so a new game gets it by copying the
     template and nothing drifts.

     Left is the mark and the wordmark, exactly as the landing page sets them.
     Where it goes depends on the surface, and PSUI.bar() sets that at runtime
     rather than each surface hard-coding a different href:
       shell -> /about/        (same destination as the About icon)
       game  -> /              (back to the front door)

     Right is a fixed order: About, Analytics, Add, Friends, Settings, Profile.
     Every surface shows all six. A surface that cannot do one yet opens a sheet
     that says so, because an icon that silently does nothing is worse than one
     that admits it is not built.

     The bar is fixed and above everything; .psbar-pad on the scrolling element
     keeps content from starting underneath it. -->

<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <symbol id="psmark" viewBox="0 0 1132 595">
    <clipPath id="psmark-band">
      <rect x="0" y="0"   width="1132" height="231"/>
      <rect x="0" y="359" width="1132" height="236"/>
    </clipPath>
    <g fill="none" stroke="currentColor" stroke-width="var(--mk-w,38)">
      <g clip-path="url(#psmark-band)">
        <ellipse cx="430" cy="295" rx="250" ry="268"/>
        <ellipse cx="702" cy="295" rx="250" ry="268"/>
      </g>
      <path d="M49 213H1083" stroke-linecap="round"/>
      <path d="M49 377H1083" stroke-linecap="round"/>
    </g>
  </symbol>
</svg>

<header class="psbar">
  <a class="psbar-brand" href="/" id="psbarBrand">
    <svg class="psbar-mark" viewBox="0 0 1132 595" aria-hidden="true"><use href="#psmark"/></svg>
    <span class="psbar-name">Play<b>Sapien</b></span>
  </a>
  <div class="psbar-gap"></div>
  <nav class="psbar-nav" aria-label="PlaySapien">
    <button class="iconbtn" type="button" id="aboutBtn" aria-label="About" title="About">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M9.2 9.2a2.9 2.9 0 1 1 4 2.7c-.8.35-1.2 1-1.2 1.8v.4"/>
        <line x1="12" y1="17.4" x2="12" y2="17.4"/>
      </svg>
    </button>
    <button class="iconbtn" type="button" id="statsBtn" aria-label="Analytics" title="Analytics">
      <!-- Radar chart. Filled rather than stroked, and on its own 1024 viewBox,
           because it is the artwork as supplied; the others are 24px strokes. -->
      <svg viewBox="0 0 1024 1024" width="20" height="20" fill="currentColor" aria-hidden="true">
        <path d="m926.8 397.1l-396-288a31.81 31.81 0 0 0-37.6 0l-396 288a31.99 31.99 0 0 0-11.6 35.8l151.3 466a32 32 0 0 0 30.4 22.1h489.5c13.9 0 26.1-8.9 30.4-22.1l151.3-466c4.2-13.2-.5-27.6-11.7-35.8M838.6 417l-98.5 32l-200-144.7V199.9zM466 567.2l-89.1 122.3l-55.2-169.2zm-116.3-96.8L484 373.3v140.8zM512 599.2l93.9 128.9H418.1zm28.1-225.9l134.2 97.1L540.1 514zM558 567.2l144.3-46.9l-55.2 169.2zm-74-367.3v104.4L283.9 449l-98.5-32zM169.3 470.8l86.5 28.1l80.4 246.4l-53.8 73.9zM327.1 853l50.3-69h269.3l50.3 69zm414.5-33.8l-53.8-73.9l80.4-246.4l86.5-28.1z"/>
      </svg>
    </button>
    <button class="iconbtn" type="button" id="addBtn" aria-label="Add" title="Add">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 8.2v7.6M8.2 12h7.6"/>
      </svg>
    </button>
    <button class="iconbtn" type="button" id="friendsBtn" aria-label="Friends" title="Friends">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="8" r="3.4"/>
        <path d="M2.8 19.4a6.2 6.2 0 0 1 12.4 0"/>
        <path d="M16.2 5.1a3.4 3.4 0 0 1 0 6.1"/>
        <path d="M18 14.4a6.2 6.2 0 0 1 3.2 5"/>
      </svg>
    </button>
    <button class="iconbtn" type="button" id="settingsBtn" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3.2"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
    <button class="iconbtn" type="button" id="profileBtn" aria-label="Profile" title="Profile">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/>
      </svg>
    </button>
  </nav>
</header>

<!-- Analytics has an icon on every surface but nothing behind it yet. It says so
     rather than doing nothing: a nav item that swallows a tap reads as broken.
     The copy differs by surface, filled in by PSUI.bar(). -->
<section class="sheet" id="statsSheet" role="dialog" aria-modal="true" aria-labelledby="statsTitle" hidden>
  <div class="sheet-in">
    <div class="sh-head"><h2 id="statsTitle">Analytics</h2>
      <button class="donebtn" type="button" data-sheet-close>Close</button></div>
    <!-- A div, not a p: a surface that HAS numbers replaces this with real
         blocks, and a <p> cannot legally contain them -- the browser would
         silently break the paragraph apart around them. ui.js writes the
         placeholder sentence in as text; a surface that knows better
         overwrites it. -->
    <div class="sethint" id="statsBody">Not built yet.</div>
  </div>
</section>

<!-- Add, on the shell only. Inside a game this same button is that game's own
     "make one" control and the game binds it; the shell has nothing to bind yet. -->
<section class="sheet" id="addSheet" role="dialog" aria-modal="true" aria-labelledby="addTitle" hidden>
  <div class="sheet-in">
    <div class="sh-head"><h2 id="addTitle">Suggest a game</h2>
      <button class="donebtn" type="button" data-sheet-close>Close</button></div>
    <p class="sethint">This will be how you put forward an idea for a new PlaySapien
      game. It is not built yet. Inside a game, this same button is how you make a
      puzzle of your own.</p>
  </div>
</section>
