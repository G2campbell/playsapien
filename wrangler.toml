# playsapien.com — the whole static platform, served by one Worker.
#
# This file is why Cloudflare was serving a "Hello world" placeholder: without
# it, a Git-connected Worker has nothing to build and the starter that the
# dashboard deploys on creation just stays live.
#
# There is no `main` here on purpose. A Worker with an [assets] directory and
# no script is a pure static site — Cloudflare serves the files directly, with
# no request ever entering Worker code, so it costs nothing per request.
#
# The API is NOT here. backend/ is its own Worker on playsapien.com/api/*, and
# a route is matched before a static-asset Worker, so the two coexist on one
# hostname with no router in between. If the two are ever merged, add
# `main` back and `run_worker_first = ["/api/*"]`.
#
# Build settings to set in the dashboard (Settings -> Build):
#   Build command    sh deploy/build.sh
#   Deploy command   npx wrangler deploy
#   Root directory   /            (leave empty)

name = "playsapien"
compatibility_date = "2026-09-15"

[assets]
directory = "./dist"
# A missing path should serve the platform's own 404, not a silent 200.
not_found_handling = "404-page"
